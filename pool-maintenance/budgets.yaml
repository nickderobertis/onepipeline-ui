schema_version: 1
budgets:
  - id: onepipeline-ui-pool-maintenance-seconds
    description: >-
      Wall-clock seconds one steady-state pass of this repository's declared
      pool maintenance takes over one ordinary run's worth of superseded cargo
      builds, as cargo-prune-superseded reports it. Protects how long a regular
      post-run pass holds one of this repository's warm-pool slots out of
      service on a host running several dispatches.
    measure: reported
    command: [./measure.sh]
    unit: seconds
    direction: max
    threshold: 20
    labels: [host]
