# The crate's test tiers, one nextest profile each.
#
# Every tier is an Nx project of its own (`project.json`, `tests/tiers/*/project.json`),
# so a change pays for the tiers it can reach rather than the whole suite. They share
# the test binaries — `e2e` is still one binary, `contract` and `packaging` one each —
# and differ only in which of those binaries' tests they select, which is declared
# here once and named by profile from every recipe that runs a tier.
#
# The ten filters partition the default collection: `unit` is every binary but the
# two the other tiers draw on, and inside `e2e` the `e2e` profile is the complement
# of the other eight. So a test added anywhere runs under exactly one tier, and one
# added to a new module of the `e2e` binary lands in `e2e` rather than nowhere.
# `tests/e2e/ensure_baseline.rs` holds the module lists below to each other, and to
# the recipes that run them.
#
# `default` is untouched: a bare `cargo nextest run` still runs everything.

# The crate's own fast tier: the library's and binary's unit tests and
# `tests/contract.rs`. `onepipeline-ui:test`.
[profile.unit]
default-filter = "not binary(=e2e) and not binary(=packaging)"
status-level = "fail"
final-status-level = "fail"

# The journeys a user drives — the binary as a subprocess, the server on a real
# port, the browser view it serves. `onepipeline-ui-e2e:test`.
[profile.e2e]
default-filter = "binary(=e2e) and not test(/^(baseline|baseline_reuse|cost|ci_jobs|ci_tier|ensure_baseline|ensure_node_without_execve|ensure_sibling|judged_tier|linked_report|linux_wheel|nx_affected|packaging|release_probe|release_status|semver_check|workspace_install)::/)"
status-level = "fail"
final-status-level = "fail"

# The repository's own machinery: the published packages' contents, the release
# and CI scripts and the provisioning recipes.
# `onepipeline-ui-repo-tooling:test`.
[profile.repo-tooling]
default-filter = "binary(=packaging) or (binary(=e2e) and test(/^(ci_tier|ensure_baseline|ensure_sibling|linux_wheel|nx_affected|release_probe|release_status|semver_check|workspace_install)::/))"
status-level = "fail"
final-status-level = "fail"

# The committed npm launcher installed for real and run under a real node, over
# the compiled binary: the process the caller starts, the stops it is asked to
# honour, and a node too old to exec, beside the recipe that provisions that
# node from its own release archive. A tier of its own, keyed on the launcher,
# its assembly and the binary, so a change to a workflow or a release script does
# not start servers through it. `onepipeline-ui-npm-launcher:test`.
[profile.npm-launcher]
default-filter = "binary(=e2e) and test(/^(ensure_node_without_execve|packaging)::/)"
status-level = "fail"
final-status-level = "fail"

# The base commit's server against this one. `onepipeline-ui-baseline:test-baseline`.
[profile.baseline]
default-filter = "binary(=e2e) and test(/^baseline::/)"
status-level = "fail"
final-status-level = "fail"

# A build of the server with `cargo auditable`, and the linked engine and plan-store
# releases its embedded dependency record names. `onepipeline-ui-linked-report:test`.
[profile.linked-report]
default-filter = "binary(=e2e) and test(/^linked_report::/)"
status-level = "fail"
final-status-level = "fail"

# The four CI jobs' recipes, driven through real Nx over a scratch copy of the
# workspace: a tier of their own, keyed on the project graph's declarations and
# the scripts, so a change to the API's or the browser view's sources does not
# re-run them.
[profile.ci-jobs]
default-filter = "binary(=e2e) and test(/^ci_jobs::/)"
status-level = "fail"
final-status-level = "fail"

# The bounds on what a read costs, counted with `strace`. `onepipeline-ui-cost:test-cost`.
[profile.cost]
default-filter = "binary(=e2e) and test(/^cost::/)"
status-level = "fail"
final-status-level = "fail"

# `just lint-llm-diff` through the real Nx and the installed llmlint, which
# `just setup-llmlint` provides. `onepipeline-ui-judged-tier:test`.
[profile.judged-tier]
default-filter = "binary(=e2e) and test(/^judged_tier::/)"
status-level = "fail"
final-status-level = "fail"

# Real Cargo dependency reuse and base/branch executable identity.
# `onepipeline-ui-baseline-reuse:test` and its cross-platform `test-quick`.
[profile.baseline-reuse]
default-filter = "binary(=e2e) and test(/^baseline_reuse::/)"
status-level = "fail"
final-status-level = "fail"
