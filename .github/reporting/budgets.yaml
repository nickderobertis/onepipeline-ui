# The budgets job measures itself: `report-job:test` and the live job each write the
# telemetry this reads, after their main result upload. `report-job:budgets` reads what
# the test recorded and reruns nothing. The limit is provisional until real runs have
# measured it.
schema_version: 1
budgets:
  # Workload: one budget job with 100 catalog rows and one rolling file of up to 20
  # eligible base commits, from cold install through checks, history, comment and main
  # result upload; identical reruns are separate jobs. Inner measure: final self-judgment,
  # persisting its own verdict and runner queue/setup/teardown cannot be inside the
  # duration being judged. Basis: design; the spike's prototype took 38.55 s including a
  # 10.49 s install over zero typed scalar archive bytes and simulated posting, so 120 s is
  # a provisional requirement rather than a measured cost. The reader is estimated at 1 s.
  # The issue explicitly requires the new last job to have its own latency budget beside the existing maximum-CI-job budget.
  - id: onepipeline-ui-budget-report-command-seconds
    description: >-
      The budget report job from its cold install through the checks, the history read, the
      comment and the main result upload. It protects the turnaround of the required check
      every pull request waits on.
    labels: [ci-report]
    measure: reported
    command: [onebudgetspec-github-action, telemetry, --metric, report-command-seconds, --input, .telemetry/report-job.json]
    unit: seconds
    direction: max
    threshold: 120
