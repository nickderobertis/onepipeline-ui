# llmlint: ignore-file[changed_behavior_has_e2e] A throwaway spike workflow: its hosted runs, cited in the spike report, are its only exercise and all it is for.
# llmlint: ignore-file[contracts_have_one_source_or_a_drift_gate] Restates the warmer's cache keys to restore exactly the families main saved, once, on a branch that never lands.
# llmlint: ignore-file[boundary_inputs_validated] A never-landed spike workflow reading the MSRV from this repository's own Cargo.toml.
# llmlint: ignore-file[no_second_broader_sweep_over_an_already_gated_commit] This spike's job is to run the instrumented sweep several times on one commit: comparing those runs is the measurement.
name: Cache price

# SPIKE (spike-onepipeline-ui-coverage-and-cache), never landed. Run by hand. It saves nothing to the Actions cache:
# rust-cache runs with `save-if: false`, actions/cache only restores, setup-bun
# and setup-node cache nothing, and no Nx remote cache is configured. ci.yml's
# pull-request trigger is off on this branch, so no test job runs.
#
#   price (<os>)      restores main's family for that OS leg read-only and sizes
#                     it, then builds every warm line of `scripts/ci-warm.sh <os>`
#                     cold and prices each (scripts/cache-price.mjs). Compiles
#                     only; runs no test.
#   coverage (linux,  one measurement of `scripts/coverage-spike.mjs` on a hosted
#    <measurement>)   runner: shapes, determinism, or cache-hit (real Nx over a
#                     scratch clone; its cache is a local directory).

on:
  pull_request:

permissions:
  contents: read

# ci-cache.yml's workflow environment: rust-cache hashes it into the key, so the
# family restored here is the one main saved.
env:
  CARGO_TERM_COLOR: always
  RUST_CACHE_GENERATION: "1"

jobs:
  price:
    name: price (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os == 'windows' && 'windows-latest' || 'macos-latest' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned tool versions
        id: tool-pins
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      - name: Free disk the cold build needs
        if: matrix.os == 'linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: What ~/.cargo/bin holds before the restore
        run: |
          # macOS runners have no ~/.cargo until the first restore.
          ls "${CARGO_HOME:-$HOME/.cargo}/bin" > "$RUNNER_TEMP/cargo-bin-before" 2>/dev/null || : > "$RUNNER_TEMP/cargo-bin-before"
      # Where ci-cache.yml places it: ahead of the MSRV toolchain, so the key is
      # main's. Restore only.
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
        with:
          shared-key: test-${{ matrix.os }}
          save-if: false
      - name: Show what the key hashed and that nothing restored a target
        run: |
          env | grep -E '^(CARGO|CC|CFLAGS|CXX|CMAKE|RUST)' | sort
          [ ! -d target ] && echo 'no restored target directory'
          echo "exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
      - name: Read the MSRV from Cargo.toml
        if: matrix.os == 'linux'
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: matrix.os == 'linux'
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }}
      - name: Bootstrap
        run: just bootstrap
      - name: Build the browser view the binary embeds
        run: just build
      - name: Build every warm line cold and price each
        env:
          DEMO_COLD_ONLY: "1"
        run: node scripts/cache-price.mjs --price
      - name: Disk at the end
        if: always()
        run: df -h . || true
