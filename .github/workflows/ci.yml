name: CI

# Pull requests run all five jobs. A push to `main` runs only `budgets`, which saves
# that commit's results as the history pull requests compare with, and re-runs none
# of the four others: branch protection requires them without requiring a branch to
# be up to date, so a merge that breaks `main` is caught by `ci-cache.yml`'s warm
# jobs, which fail when `main` does not build (AGENTS.md, "Commits, releases, and
# merging").
on:
  pull_request:
    # GitHub's default three, without `ready_for_review`: a draft's runs already
    # report on its head commit, and lifting it changes no commit, so a run on
    # the lift would only repeat them.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

# Branch protection rules on a pull request's head alone, so a run its next push
# superseded decides nothing and would only hold one of the account's shared
# job slots. A push to `main` is never cancelled by the next: each is a commit of
# the base history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The one variable rust-cache hashes into its key that these jobs set, and
# `ci-cache.yml` sets it alike, so the key it saves is the key these restore.
env:
  CARGO_TERM_COLOR: always

jobs:
  # One lint job and one test job per platform. Each of the four runs its checks through one recipe of its own — `just
  # ci-lint`, `ci-test-linux`, `ci-test-windows`, `ci-test-macos`, all of them
  # `scripts/ci-job.sh` — as one Nx invocation scoped to the projects the diff
  # reaches, so a job's checks run side by side rather than one after another and
  # a pull request touching nothing a platform tests finishes that job quickly.
  # None waits on another: a pull request's wait is its slowest job, and each
  # job's runner slot is one of the account-wide limit every repository shares.
  # With `budgets` below they are the whole of a pull request's CI, and the contexts branch
  # protection requires.
  #
  # Each restores the Rust build `ci-cache.yml` saves on `main` for its OS and
  # saves none of its own: the repository's Actions cache holds main's builds,
  # never a pull request's.
  # What does not depend on the platform it runs on: the PR title, the
  # suppressions comment, formatting, lints and type checks, the MSRV floor, the
  # dependency audit, the judged lint and the visual docs — and the advisories
  # report, which posts a status of its own and never fails this job.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # What this job writes while VISUAL_DOCS_PUBLISH is off: the suppressions
    # comment and the PR-title read. Turning publishing on adds `contents: write`
    # (the gallery deploy) and `pages: read` (the Pages build screencomp gates on).
    permissions:
      contents: read
      pull-requests: write
      # The `advisories` commit status the advisories report step posts.
      statuses: write
      checks: write
    env:
      # The one switch for the visual docs' side effects: the sticky comment and
      # the /pr-<n>/ preview deploy. Off because this job must finish inside its
      # 30-minute cap: on the base it already ran 20-27 minutes without them, and
      # the deploy adds about 2.5 more, most of it screencomp waiting on the Pages
      # build (run 41372259287 was cancelled at the cap inside that wait). So pull
      # requests get no gallery preview, and visual-docs.yml's `closed` cleanup
      # has none to delete. The capture, the reproducibility gate, classify and
      # the gallery build run and block either way.
      VISUAL_DOCS_PUBLISH: "false"
      # One selection definition for every job's Nx/report steps. Job scope
      # preserves the global Rust-cache environment shared with ci-cache.yml.
      NX_BASE: &nx-base ${{ github.event.pull_request.base.sha }}
      NX_HEAD: &nx-head ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base for affected selection, notignored's scan and the
          # judge's diff; the base manifest screencomp's comment diffs against.
          fetch-depth: 0
          # This job's token can write, and the judge below runs harness agents
          # over the checkout: no credential is left in it for them to find.
          persist-credentials: false
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      # Main's Linux build, which `ci-cache.yml`'s `warm-linux` saves for this job
      # and `test-linux` alike: restored, never saved from here. Ahead of the MSRV
      # toolchain, because rust-cache hashes every installed toolchain and the
      # CARGO_* variables dtolnay exports into its key: placed after it, this job
      # would look for a key neither the warm job nor `test-linux` shares.
      - name: Disk — Before Rust cache restore
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/report-disk.sh "Before Rust cache restore" || true
          node .github/scripts/disk-delivery.mjs start "$PPID" || true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-linux
          save-if: false
      - name: Disk — After Rust cache restore
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/disk-delivery.mjs stop || true
          bash .github/scripts/report-disk.sh "After Rust cache restore" || true
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      # A fork's run writes nothing to any cache: this action saves its own binary otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},cargo-deny@${{ steps.tool-pins.outputs.cargo-deny }},cargo-machete@${{ steps.tool-pins.outputs.cargo-machete }}
      - name: Formatting, lints, type checks, MSRV and audit (affected projects)
        if: ${{ !cancelled() }}
        run: just ci-lint
      # The advisories report (.github/required-contexts.mjs). `!cancelled()`
      # posts the status whatever the steps before it did; HEAD_REPO lets the
      # recipe skip posting for a fork, whose token is read-only.
      #
      # llmlint: ignore-block[diagnostics_error_or_absent] no advisory becomes a warning here: every one still fails this step and turns the `advisories` status red until it is fixed. `continue-on-error` keeps only that report out of the required `lint` result, which the user ruled must not block on an advisory a change did not bring in; one it did bring in fails `lint` through the audit above.
      - name: Advisories report (informational, posts the advisories status)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: just advisories-status "$HEAD_SHA" "$HEAD_REPO"
      # llmlint: ignore-end[diagnostics_error_or_absent]
      # A fork's run writes nothing to any cache: this action saves its own otherwise.
      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          version: ${{ steps.tool-pins.outputs.uv }}
          enable-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # The judged tier, a blocking part of this check. Its harnesses are pinned
      # rather than floating, because an upstream release has taken this check
      # down for every pull request before: bump one deliberately, once a newer
      # one is shown green here. oneharness falls through only to a harness it
      # can spawn, so the claude-code fallback is installed and credentialled
      # too, and a missing credential fails rather than reporting unlinted files
      # as clean. Fork pull requests are gated by the repository's
      # require-approval-for-fork-workflows setting.
      - name: Install the Codex harness
        if: github.event_name == 'pull_request' && !cancelled()
        run: npm install -g @openai/codex@0.145.0
      - name: Install the Claude Code harness (oneharness fallback)
        if: github.event_name == 'pull_request' && !cancelled()
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: Install llmlint toolchain
        if: github.event_name == 'pull_request' && !cancelled()
        run: just setup-llmlint
      - name: Validate llmlint config
        if: github.event_name == 'pull_request' && !cancelled()
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs CLAUDE_CODE_OAUTH_TOKEN for the claude-code fallback harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
      # The visual docs, through screencomp's composite actions as steps of this
      # job rather than its reusable workflow, which would add five jobs. The
      # capture is the repository's one capture path, `just dag-ui-screens`
      # (scripts/visual-capture.sh): the bundle and the server it photographs are
      # built on this host, and the rendering runs in the Playwright image that
      # script derives from apps/dag-ui-e2e/package.json — the pin the committed
      # baseline was captured under. Twice, for the reproducibility gate: two
      # containers rendering one build side by side, each its own stack, because
      # a capture is almost all waiting for each page to settle and one after the
      # other they took 16 of this job's 30 minutes (run 41381681315: 10m29s with
      # the build, then 8m02s and cancelled at the cap).
      - name: Log runner CPU (cross-CPU anti-aliasing drift diagnostics)
        if: github.event_name == 'pull_request' && !cancelled()
        run: grep -m1 'model name' /proc/cpuinfo || true
      - name: Capture the visual docs twice, for the reproducibility gate
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          SHOTS_OUT: shots/current/x86_64
          SHOTS_VERIFY: shots/verify/x86_64
        run: just dag-ui-screens
      - name: Upload x86_64 capture for baseline review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: screencomp-capture-x86_64
          path: shots/current/x86_64
          retention-days: 3
          # Setup or capture may fail before producing files; their existing
          # checks own that failure, and this retrieval step adds no gate.
          if-no-files-found: ignore
      - uses: nickderobertis/screencomp@v0
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          # Pinned with the reusable workflow visual-docs.yml calls, so both
          # paths judge with one CLI; .github/tests/ci-jobs.test.mjs holds the
          # two pins, and the comment's lane below to classify's inputs, equal.
          version: v0.4.8
      - name: Classify, gate and build the gallery
        id: classify
        if: github.event_name == 'pull_request' && !cancelled()
        uses: nickderobertis/screencomp/visual-docs@v0
        with:
          project: ""
          arch: x86_64
          current: shots/current
          manifest: ""
          gallery-title: Visual docs
          verify-second: shots/verify
          pages: "true"
          publish: ${{ env.VISUAL_DOCS_PUBLISH }}
          fail-on-drift: "true"
          update-manifest: "false"
          comment-mode: aggregated
          pages-artifact: screencomp-gallery-x86_64
          github-token: ${{ github.token }}
      - name: Deploy the gallery preview
        if: env.VISUAL_DOCS_PUBLISH == 'true' && !cancelled() && steps.classify.outcome != 'skipped'
        uses: nickderobertis/screencomp/visual-docs-pages@v0
        with:
          github-token: ${{ github.token }}
      - name: Post the visual docs comment
        if: ${{ !cancelled() && steps.classify.outcome != 'skipped' }}
        uses: nickderobertis/screencomp/visual-docs-aggregate@v0
        with:
          matrix: '[{"arch":"x86_64","project":"","current":"shots/current","verify":"shots/verify","manifest":"","gallery_title":"Visual docs"}]'
          publish: ${{ env.VISUAL_DOCS_PUBLISH }}
          github-token: ${{ github.token }}
      # The two checks that need no toolchain go last, so neither failing can
      # skip the setup every other check here needs.
      # Under squash-merge the title becomes the release-driving commit.
      - name: Lint the PR title
        if: github.event_name == 'pull_request' && !cancelled()
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One sticky comment listing the lint and type-check suppressions this
      # change adds — each with its rule, its stated reason and a link — so a
      # reviewer sees every bypass without reading the diff line by line. A
      # review artifact rather than a verdict. A fork's token cannot upsert a
      # comment, so a fork's pull request skips it.
      - name: Comment the suppressions this change adds
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !cancelled()
        uses: nickderobertis/notignored@v0

      - name: Report cache entries and task executions
        if: always()
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs report --job "$GITHUB_JOB" --out "$RUNNER_TEMP/nx-cache-report"
          for profile in target/llvm-cov-target/*.profraw; do
            if [ -f "$profile" ]; then du -k "$profile"; fi
          done
          for directory in apps/dag-ui/dist packages/dag-layout/dist packages/dag-model/dist packages/telemetry-client/dist packages/timeline-categories/dist; do
            if [ -d "$directory" ]; then
              du -sk "$directory"
            else
              echo "$directory: not built in this workspace"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.nx-cache-trust.outputs.promotable == 'true'
        with:
          name: nx-cache-entries-${{ github.job }}
          path: ${{ runner.temp }}/nx-cache-report
          retention-days: 7
      # GitHub accepts only cancel here; job teardown also stops the background step.
      - cancel: nx-cache
      - name: Disk — End of job
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report-disk.sh "End of job" || true

  # The deterministic gate on Linux: `check`'s tiers over the affected projects
  # (every test tier, the Playwright browser tier, the coverage floor, docs —
  # formatting, lints and type checks are `lint`'s), the documented install and
  # the release's x86_64 wheel, in one Nx run so the packaging compiles beside
  # the tiers. On the release pull request (`scripts/ci-tier.sh`)
  # it is the sweep: every project, with the host-labelled budgets, and the
  # wheel the release journeys' rehearsal builds, installs and runs.
  test-linux:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    # 29.8 min upper estimate / 0.85, rounded up: docs/release-sweep-timing.md.
    timeout-minutes: 36
    env:
      NX_BASE: *nx-base
      NX_HEAD: *nx-head
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      # Main's Linux build, restored and never saved from here, as in `lint`.
      - name: Disk — Before Rust cache restore
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/report-disk.sh "Before Rust cache restore" || true
          node .github/scripts/disk-delivery.mjs start "$PPID" || true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-linux
          save-if: false
      - name: Disk — After Rust cache restore
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/disk-delivery.mjs stop || true
          bash .github/scripts/report-disk.sh "After Rust cache restore" || true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      # A fork's run writes nothing to any cache: this action saves its own binary otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      # The release journeys' release-plz and cargo-cyclonedx, at the justfile's
      # pins, from their checksummed release archives: `just release-tools`
      # copies these into `.tools` rather than compiling them on every run.
      # cargo-deny and cargo-machete are what `tests/e2e/deps_audit.rs` audits
      # its fixture crates with; those journeys fail rather than skip without them.
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }},cargo-deny@${{ steps.tool-pins.outputs.cargo-deny }},cargo-machete@${{ steps.tool-pins.outputs.cargo-machete }},release-plz@${{ steps.tool-pins.outputs.release-plz }},cargo-cyclonedx@${{ steps.tool-pins.outputs.cargo-cyclonedx }}
      # What `tests/e2e/cost.rs` counts with. Those journeys hold the bounds on
      # what a read may do to a runs root, counted from the kernel's own record
      # of the server rather than from a clock; they are Linux-only, this is the
      # job that runs them, and they fail rather than skip without the tracer.
      - name: Install the syscall tracer the cost journeys count with
        run: sudo apt-get update && sudo apt-get install -y strace
      # The judged tier's journeys drive the real installed llmlint, with only
      # the paid model call stood in for, and fail rather than skip without it.
      # A fork's run writes nothing to any cache: this action saves its own otherwise.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.tool-pins.outputs.uv }}
          enable-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install llmlint for the judged tier's journeys
        run: just setup-llmlint
      # What the two clone-local binaries below are built from, read where the
      # recipes read it, so a cache key cannot name one thing while the recipe
      # provisions another: the release the lock pins the SDK to, with the source
      # it resolves it from, and the commit this branch forked from
      # (scripts/ensure-baseline-api.sh's resolution). `ci-cache.yml` saves both
      # on `main`; a miss provisions them here.
      - name: What the provisioned binaries are built from
        id: pins
        run: |
          echo "onepipeline=$(just --evaluate onepipeline-version)-$(just --evaluate onepipeline-source | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "base=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"
      - name: Restore the sibling CLI
        id: sibling
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline
            .tools/bin/onepipeline.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Restore the base commit's server
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline-api-baseline
            .tools/bin/onepipeline-api-baseline.commit
          key: onepipeline-api-baseline-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.base }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-baseline-api.sh') }}
      - name: Bootstrap
        run: just bootstrap
      - name: Which tier of the gate this build owes
        id: tier
        run: echo "tier=$(bash scripts/ci-tier.sh)" >> "$GITHUB_OUTPUT"
      - name: Gate, install and wheel (affected projects; every project on the release PR)
        run: just ci-test-linux --tier "${{ steps.tier.outputs.tier }}"
      # What each `budgets` target this job ran saved, which the `budgets` job's rows read.
      # Uploaded even after a failure, so the rest of the report keeps its figures, and
      # absent when this change reached no budget.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-check-results-test-linux
          path: target/budget-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report cache entries and task executions
        if: always()
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs report --job "$GITHUB_JOB" --out "$RUNNER_TEMP/nx-cache-report"
          for profile in target/llvm-cov-target/*.profraw; do
            if [ -f "$profile" ]; then du -k "$profile"; fi
          done
          for directory in apps/dag-ui/dist packages/dag-layout/dist packages/dag-model/dist packages/telemetry-client/dist packages/timeline-categories/dist; do
            if [ -d "$directory" ]; then
              du -sk "$directory"
            else
              echo "$directory: not built in this workspace"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.nx-cache-trust.outputs.promotable == 'true'
        with:
          name: nx-cache-entries-${{ github.job }}
          path: ${{ runner.temp }}/nx-cache-report
          retention-days: 7
      - cancel: nx-cache
      - name: Disk — End of job
        if: always()
        shell: bash
        # Measurements must leave the job verdict and later success() conditions alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report-disk.sh "End of job" || true

  # The platform-sensitive tiers on Windows (`check-cross`: formatting, lints and
  # the suite against a real binary, without the Linux-only coverage floor), the
  # release's browser build, and the documented install.
  test-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NX_BASE: *nx-base
      NX_HEAD: *nx-head
    steps:
      - uses: actions/checkout@v4
        with:
          # The `ensure_baseline::` journeys resolve the commit this branch forked
          # from, which a shallow checkout does not have.
          fetch-depth: 0
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      # Main's Windows build, which `ci-cache.yml`'s `warm-windows` saves:
      # restored, never saved from here.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-windows
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      # A fork's run writes nothing to any cache: this action saves its own binary otherwise.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }}
      - name: What the provisioned sibling is built from
        id: pins
        run: echo "onepipeline=$(just --evaluate onepipeline-version)-$(just --evaluate onepipeline-source | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore the sibling CLI
        id: sibling
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline.exe
            .tools/bin/onepipeline.exe.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Bootstrap
        run: just bootstrap
      - name: Platform tiers, browser build and install (affected projects)
        run: just ci-test-windows

      - name: Report cache entries and task executions
        if: always()
        shell: bash
        run: |
          node scripts/nx-remote-cache.mjs report --job "$GITHUB_JOB" --out "$RUNNER_TEMP/nx-cache-report"
          for profile in target/llvm-cov-target/*.profraw; do
            if [ -f "$profile" ]; then du -k "$profile"; fi
          done
          for directory in apps/dag-ui/dist packages/dag-layout/dist packages/dag-model/dist packages/telemetry-client/dist packages/timeline-categories/dist; do
            if [ -d "$directory" ]; then
              du -sk "$directory"
            else
              echo "$directory: not built in this workspace"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.nx-cache-trust.outputs.promotable == 'true'
        with:
          name: nx-cache-entries-${{ github.job }}
          path: ${{ runner.temp }}/nx-cache-report
          retention-days: 7
      - cancel: nx-cache

  # The platform-sensitive tiers and install, with proven results replayed on
