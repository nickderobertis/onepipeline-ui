  # The released report action, once the four jobs have ended however they ended, on
  # every pull request and every push to `main`. It builds and tests nothing: each
  # budget whose command can run here runs once through ordinary `onebudgetspec
  # check`, and only an ordinary budget verdict fails it. The release-tail and
  # host-variable budgets are report-only here, as they are everywhere they run
  # outside the tail and the gate. The full history lets local git prove each saved
  # base commit's ancestry, and the group serializes comment writers.
  budgets:
    needs: [lint, test-linux, test-windows, test-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: budget-report-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nickderobertis/onebudgetspec-github-action@v0.3.0
        with:
          token: ${{ github.token }}
          enforcement-exclude-labels: release-tail,host-variable
          # What `test-linux`'s targets saved: those rows show that figure, and their
          # commands do not run here.
          saved-results-artifacts: budget-check-results-*
          # Budgets a pull request cannot measure or move leave the table for one
          # counted line; whatever checks each elsewhere is unchanged.
          omit-labels: not-measured-on-pr
