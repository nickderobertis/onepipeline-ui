# Visual docs via screencomp's reusable workflow: the pictures of the DAG Observatory
# in README.md, gated on the content hash of every one of them.
#
# The capture step is this repository's; screencomp owns everything after it — the
# classify gate, the gallery, its GitHub Pages deploy, and the sticky before/after
# comment that is the whole point of this for a UI nobody can otherwise see mid-change.
#
# A workflow of its own, deliberately. Screenshots assert nothing and cost a container
# and a Rust build, so nothing here is reachable from `just check`, from `just gate` —
# this repository's complete pre-push bar — or from ci.yml's gate job, exactly as this
# repository keeps every other informational tier outside them.
#
# Which CPU arch(es) CI captures is read from [capture].arches in screencomp.toml, one
# lane per arch on a matching runner; this file names no arch of its own.

name: Visual docs

on:
  pull_request:
    # `closed` lets screencomp delete this PR's gh-pages preview once it closes,
    # so stale /pr-<n>/ galleries do not accumulate on the branch.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    # On-demand canonical redeploy. A push to main only redeploys the canonical
    # gallery if its visual-docs run runs to completion, and a run can be superseded
    # when several merges land close together — a release burst here does exactly
    # that — leaving the deployed gallery a commit or two behind main.
  schedule:
    # Monthly: prune the gh-pages gallery history so the committed PNGs do not grow
    # the branch without bound. Keeps the 20 most recent versions (see
    # `gh-pages-history-versions` below).
    - cron: "27 4 1 * *"

permissions:
  contents: write       # push the gh-pages gallery
  pull-requests: write  # post the diff comment
  pages: read           # gate the run on the Pages build the deploy triggers

jobs:
  visual-docs:
    uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@v0.4.8
    with:
      # Pin the CLI as well as the workflow: the reusable workflow's internal
      # composite actions float on the `@v0` major tag, so pinning only the workflow
      # ref would still let a newer CLI — and a different verdict — roll in
      # unannounced. `screencomp doctor --env` reports these two parting.
      screencomp-version: v0.4.8
      # The capture container, pinned to the `@playwright/test` in
      # apps/dag-ui-e2e/package.json. scripts/visual-capture.sh derives this same tag
      # from that manifest for the local guard, and
      # apps/dag-ui/src/test/visual-docs.test.ts fails when the three part — which
      # matters because the guard is what regenerates the baseline this job gates
      # against, so a skew between them makes the gate meaningless. Bump the
      # dependency and this line together.
      container: mcr.microsoft.com/playwright:v1.62.0-noble
      # Strict gate: this job FAILS when the capture drifts from the committed
      # baseline. An intended visual change is re-blessed locally by the pre-push
      # guard and committed, so CI goes red only on drift nobody meant.
      fail-on-drift: true
      # Keep the gh-pages gallery bounded: delete this PR's preview when it closes
      # and prune gh-pages history on the schedule above.
      gh-pages-maintenance: true
      gh-pages-history-versions: 20
      # The capture writes $SHOTS_OUT/captures.json plus the PNGs it references
      # ($SHOTS_OUT is exported as shots/current/<arch> per lane).
      #
      # It runs inside the container above, which carries node and the matching
      # browser and nothing else — so the two things this capture photographs have to
      # be built here first. The bundle is Vite's; the binary is the read API the
      # bundle is served by, because `apps/dag-ui-e2e/fixtures/serve-fixture.mjs`
      # drives the real `onepipeline-api serve --ui` over a generated fixture runs
      # root rather than a double, and locates that binary rather than building it.
      # A developer's machine already has a toolchain and scripts/visual-capture.sh
      # builds both on the host before it starts the same container; this lane is a
      # fresh root container that has neither, which is the whole of the difference
      # between the two.
      #
      # Nothing below reaches a network once the build is done: the fixture is
      # generated on disk, every server is on loopback, and no credential, model or
      # live run is involved anywhere in the capture.
      capture-command: |
        # Record the runner's CPU. ubuntu-latest hands out heterogeneous CPUs and
        # Blink lays text out in floating point, so the last bit of an anti-aliased
        # glyph edge can differ across microarchitectures. This line is what turns
        # "same commit, passed then failed" into something readable. Renders no bytes.
        echo "runner CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
        npm ci
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
        export PATH="$HOME/.cargo/bin:$PATH"
        # rust-toolchain.toml pins the channel, so this installs that one and no other.
        npx nx run dag-ui:build-api-server
        # $SHOTS_OUT arrives relative to the checkout; the config resolves it against
        # the repository root, which is where this runs from.
        npx playwright test --config apps/dag-ui-e2e/screenshots.config.ts
