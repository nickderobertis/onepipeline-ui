name: Release

# Build, verify and publish everything a published GitHub Release ships: the
# archives on the Release, the PyPI wheels, the npm packages and the crate.
#
# The Release is what fires this: release-plz (see release-plz.yml) computes the
# version, writes the changelog and manifests, tags `vX.Y.Z`, and cuts the
# Release. Versioning and building stay separate workflows, joined only by that
# Release. Creating a Release by hand in the GitHub UI is the supported manual
# fallback — it triggers this same path.
#
# release-plz authenticates with a PAT precisely so that Release fires this
# workflow — a tag or release created by the default GITHUB_TOKEN triggers
# nothing, and the release would silently ship no artifacts.
#
# Four jobs, and each job's work is one recipe in the justfile, implemented by
# scripts/release.mjs, which says what each phase does and holds the one table
# of release targets:
#
#   * build-linux, build-macos, build-windows — each builds its platform's
#     targets once, packs the archive, the wheel and the npm platform package
#     from that one binary, installs and runs those exact files, publishes them
#     (Release assets always; PyPI and npm when their switches are on), and then
#     installs the version back from every registry on its own OS and runs it.
#     The three run side by side and need nothing from one another.
#   * publish — once all three have run, whatever they did: refuses to publish
#     anything unless every platform's files are served, then publishes what
#     belongs to no platform (the crate, the npm launcher and frontend, the
#     SBOM), installs the launcher back, and holds the GitHub Release to the
#     outcome — a release that did not publish is demoted to a prerelease.
#
# A failed platform job therefore leaves the other platforms' files published
# and the platform-independent ones unpublished; re-running the failed jobs
# finishes the release, because every upload asks the registry first and
# publishes only what it does not already serve.
#
# There is no test re-run here. The tree a Release names is the one ci.yml's
# `sweep` already ran the whole gate over on the release pull request; what this
# workflow proves is the artifacts, by installing and running each one before it
# publishes and again from the registry after.
#
# The version is never written here: every artifact takes it from Cargo.toml
# (maturin via `dynamic = ["version"]`, npm via scripts/npm-build.mjs), so
# release-plz stays the single version driver.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] PyPI and npm
# publication are switched by the PYPI_PUBLISH / NPM_PUBLISH repository variables,
# which is the operator's control over whether a Release reaches a public registry
# at all — a fork, or a repo whose tokens are not provisioned, must not publish.
# The two properties the rule protects are still held: every artifact is built and
# installed on every release whatever the switches say, so a packaging break
# reddens a release even while publishing is off; and each upload *requires* its
# credential, failing with the secret to set when its switch is on and the token
# is empty (scripts/release.mjs).

on:
  release:
    types: [published]

# Nothing by default: each job asks for what it writes.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tag every phase holds Cargo.toml's version to, and the Release it reads
  # and writes through gh.
  RELEASE_TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
  # The operator's switches, read by `verify`, `check` and `settle`: a registry
  # that is switched off is one this release was not waiting for.
  PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
  NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Attaching the archives to the Release is a write to it.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the release's Python tools
        run: just release-python-tools
      # The view the binary embeds, built before the binary is: with the
      # `bundled-ui` feature on, a build that finds none fails rather than
      # publishing a binary whose `--ui` refuses.
      - name: Build the browser view
        run: just build
      # Inside the manylinux image, through the one Linux wheel definition
      # ci.yml's `wheel` job runs on every pull request that reaches the crate.
      - name: Build every Linux target once, and pack its archive, wheel and npm package
        run: just release-linux build
      - name: Install and run those exact files before anything publishes
        run: just release-linux test-install
      - name: Publish the archives and checksums to the Release
        run: just release-linux upload github
      - name: Publish the wheels to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just release-linux upload pypi
      - name: Publish the npm platform packages
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-linux upload npm
      - name: Install the version from every registry on Linux and run it
        run: just release-linux verify

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the release's Python tools
        run: just release-python-tools
      - name: Build the browser view
        run: just build
      # Apple Silicon only: Intel macOS is no longer released.
      - name: Build every macOS target once, and pack its archive, wheel and npm package
        run: just release-macos build
      - name: Install and run those exact files before anything publishes
        run: just release-macos test-install
      - name: Publish the archives and checksums to the Release
        run: just release-macos upload github
      - name: Publish the wheels to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just release-macos upload pypi
      - name: Publish the npm platform packages
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-macos upload npm
      - name: Install the version from every registry on macOS and run it
        run: just release-macos verify

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the release's Python tools
        run: just release-python-tools
      - name: Build the browser view
        run: just build
      - name: Build every Windows target once, and pack its archive, wheel and npm package
        run: just release-windows build
      - name: Install and run those exact files before anything publishes
        run: just release-windows test-install
      - name: Publish the archives and checksums to the Release
        run: just release-windows upload github
      - name: Publish the wheels to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just release-windows upload pypi
      - name: Publish the npm platform packages
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-windows upload npm
      - name: Install the version from every registry on Windows and run it
        run: just release-windows verify

  # `always()` because a platform job that failed would otherwise skip this
  # whole job — and the demotion with it, leaving a Release that did not publish
  # marked Latest, which is how v0.2.0 and v0.3.0 were stranded. What keeps a
  # failed platform from being followed by the launcher and the crate is `check`,
  # which every upload below also repeats before publishing anything.
  publish:
    needs: [build-linux, build-macos, build-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The SBOM is a Release asset, and the demotion rewrites the Release.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Results arrive as environment variables rather than inside a `run:`
      # string: a value interpolated into a shell command is a command the
      # workflow did not write.
      BUILD_RESULTS: >-
        build-linux=${{ needs.build-linux.result }}
        build-macos=${{ needs.build-macos.result }}
        build-windows=${{ needs.build-windows.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-cyclonedx@0.5.7
      - name: Every platform served its files
        id: check
        run: just release-publish check
      - name: Assemble the crate, the npm launcher and frontend, and the SBOM
        id: build
        run: |
          just build
          just release-publish build
      # The secret's presence is the crate's switch, as it always was: the
      # recipe publishes nothing to crates.io without it.
      - name: Publish the crate
        id: upload-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: just release-publish upload crate
      - name: Publish the npm launcher and the frontend package
        id: upload-npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-publish upload npm
      - name: Attach the SBOM to the Release
        id: upload-github
        run: just release-publish upload github
      - name: Install the launcher from npm and read the crate and the SBOM back
        id: verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: just release-publish verify
      # The last word on whether this tag means anything, reached on every path
      # this job runs at all; scripts/release-status.sh holds the decision.
      - name: Hold the Release to what actually published
        id: settle
        if: always()
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          STEP_RESULTS: >-
            check=${{ steps.check.outcome }}
            build=${{ steps.build.outcome }}
            upload-crate=${{ steps.upload-crate.outcome }}
            upload-npm=${{ steps.upload-npm.outcome }}
            upload-github=${{ steps.upload-github.outcome }}
            verify=${{ steps.verify.outcome }}
        run: just release-publish settle
