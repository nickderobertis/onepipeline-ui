name: Release

# Build, archive, checksum, and publish everything a published GitHub Release
# ships: the cross-platform binaries, the PyPI wheels, and the npm packages.
#
# The Release is what fires this: release-plz (see release-plz.yml) computes the
# version, writes the changelog and manifests, tags `vX.Y.Z`, and cuts the
# Release. Versioning and building stay separate workflows, joined only by that
# Release. Creating a Release by hand in the GitHub UI is the supported manual
# fallback — it triggers this same validated path.
#
# release-plz authenticates with a PAT precisely so that Release fires this
# workflow — a tag or release created by the default GITHUB_TOKEN triggers
# nothing, and the release would silently ship no artifacts.
#
#   * test          — the complete deterministic gate, so untested artifacts
#                     never publish.
#   * upload        — build each target on a native runner and attach the archive
#                     + sha256 checksum to the Release.
#   * verify-assets — download what `upload` attached, under the names it
#                     publishes, check the checksum, and smoke-test the binary.
#                     Ungated: a GitHub Release always publishes.
#   * publish-crate — idempotent crates.io publish; self-activates the day
#                     CARGO_REGISTRY_TOKEN is set.
#   * build-wheels  — wrap the prebuilt binary in per-platform PyPI wheels with
#                     maturin (the ruff/uv pattern). Runs unconditionally, so a
#                     packaging break reddens the release even while publishing
#                     is switched off.
#   * publish-pypi  — upload those wheels to onepipeline-api-cli with the
#                     PYPI_TOKEN secret, gated on the PYPI_PUBLISH repo variable.
#   * verify-pypi   — on Linux, both macOS architectures, and Windows,
#                     pip-install the exact version just published and run
#                     scripts/smoke-published.sh over it.
#   * build-npm     — wrap the same prebuilt binary in per-platform npm packages
#                     (onepipeline-api-cli-<platform>-<arch>) via
#                     scripts/npm-build.mjs. Unconditional, same rationale.
#   * publish-npm   — publish the platform packages, then the launcher that
#                     depends on them, with the NPM_TOKEN secret, gated on the
#                     NPM_PUBLISH repo variable.
#   * verify-npm    — the same, on the same matrix, for `npm install -g`.
#   * release-status — runs whatever the jobs above did, and holds the GitHub
#                     Release to it: a release whose publishing did not complete
#                     is demoted to a prerelease with a banner naming the jobs,
#                     so a stranded tag can never read as a shipped version.
#
# Every verify job runs the version at publish time only. `published-smoke.yml`
# runs the identical script against whatever the registries and the Release serve
# as `latest`, on every completed run of this workflow — the moment what `latest`
# resolves to can have changed — and files a failure as an issue, since no check
# turns red for it.
#
# The version is never written here: every artifact takes it from Cargo.toml
# (maturin via `dynamic = ["version"]`, npm via scripts/npm-build.mjs), so
# release-plz stays the single version driver.
#
# llmlint: ignore-file[changed_behavior_has_e2e] the publish and verify jobs are steps
# in a GitHub Actions job on a published Release: installing an exact version until the
# registry serves it, and smoke-testing what it installed. Driving them from a test
# would mean standing up a runner and a public release, or replacing both with a
# simulation — and a simulation is what would then be under test. They are proven the
# only way they can be, by running on every real release, and everything they call that
# *can* be driven locally is: scripts/npm-build.mjs and the committed launcher in
# tests/e2e/packaging.rs, and scripts/smoke-published.sh on every pull request through
# ci.yml's `install` job.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] the publish and
# verify jobs are deliberately switched by the PYPI_PUBLISH / NPM_PUBLISH repository
# variables, which is the operator's control over whether a Release reaches a public
# registry at all — a fork, or a repo whose tokens are not provisioned, must not
# publish. The two properties the rule protects are still held: the tier *compiles*
# on every release, because build-wheels and build-npm are ungated on purpose, so a
# packaging break reddens a release even while publishing is off; and it *requires*
# its credential, because each publish job fails fast with the secret to set when its
# variable is on and the token is empty. What cannot be had is a live publish that
# runs unconditionally — that is a product decision, not a missing check.

on:
  release:
    types: [published]

# Nothing by default: the jobs that read the repository ask for `contents: read`
# themselves, and the ones that only move artifacts between jobs or install from
# a public registry get a token with no scopes at all.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io publishing self-activates once the CARGO_REGISTRY_TOKEN secret
  # exists. `secrets` cannot be read in a job `if:`, so read it into an env var
  # here and expose its presence as an output the publish job gates on. The PyPI
  # and npm jobs need no such guard: they gate on repository *variables*, which
  # `if:` can read directly.
  guard:
    runs-on: ubuntu-latest
    # Reads whether a secret is set and writes a job output — no repo access.
    permissions: {}
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Re-gate the release on the same checks CI enforces, so a release can never
  # publish an artifact that would not pass the gate.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # `just check` runs the baseline comparison, which resolves this
          # revision's base out of version control rather than out of a file. A
          # shallow checkout of the released tag has neither `origin/main` nor
          # `main`, so that resolution fails here for want of history rather than
          # for anything the release got wrong.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      - run: just bootstrap
      # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] the sweep merge-to-main runs is not this path's. A Release created by hand in the GitHub UI is supported — this workflow's header says so — and it can name any commit, including one no push to `main` ever swept, while every job below publishes artifacts built from whatever it names. This is the only gate that commit meets.
      - run: just check

  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so nothing needs cross-compilation.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, archive, checksum, and upload
        # Same rule as the wheel and npm builds: four of these targets are
        # compiled nowhere else, so a warning specific to one has no other job
        # to surface it.
        env:
          RUSTFLAGS: "-D warnings"
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: onepipeline-api
          target: ${{ matrix.target }}
          # The asset-naming contract. `verify-assets` below downloads under
          # exactly this template, so a change to one that is not made in the
          # other fails the release rather than a user's install.
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          # Uploading an asset to a release that already exists triggers no
          # workflow, so the job-scoped GITHUB_TOKEN is the least privilege that
          # does the job; a PAT here would only widen it. The PAT this pipeline
          # does need is RELEASE_PLZ_TOKEN, which cuts the Release that starts
          # this workflow — see release-plz.yml.
          token: ${{ secrets.GITHUB_TOKEN }}

  # Post-upload gate: `upload` proves the assets were attached; nothing proved
  # they could be *fetched under the names an installer builds*, or that the
  # checksum beside each one matches it. This downloads them the way a user does
  # and hands the extracted binary to the same smoke script every other verify
  # leg uses.
  #
  # Three legs: the release ships a `.zip` for Windows, whose extraction under a
  # POSIX shell needs `unzip` the Windows image does not carry — the Windows
  # install path documented in the README is `cargo install`, which ci.yml
  # exercises on windows-latest.
  verify-assets:
    name: verify-assets (${{ matrix.target }})
    needs: upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke script, at the tag that was published.
      - uses: actions/checkout@v4
      - name: Check the release tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # Release assets are served from a CDN that converges after the upload API
      # answers, so the download is the propagation probe here for the same
      # reason the install is for PyPI and npm.
      - name: Download the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="onepipeline-api-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          bash scripts/retry-install.sh \
            --label "GitHub Release $archive" \
            --action "check the release's assets — upload may have attached no archive or no .sha256 for this target" \
            -- gh release download "$GITHUB_REF_NAME" --dir dl \
              --pattern "$archive" --pattern "${archive%.tar.gz}.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Verify the checksum and smoke-test the binary
        run: |
          cd dl
          # The checksum file names the archive, so it verifies the asset pair
          # rather than a name this step re-derived.
          shasum -a 256 -c "${ARCHIVE%.tar.gz}.sha256"
          tar -xzf "$ARCHIVE"
          cd ..
          bash scripts/smoke-published.sh \
            --expect-version "${GITHUB_REF_NAME#v}" \
            --command "$PWD/dl/onepipeline-api" \
            --label "GitHub Release onepipeline-api $GITHUB_REF_NAME on $RUNNER_OS/$RUNNER_ARCH"

  # crates.io publishing: runs whenever CARGO_REGISTRY_TOKEN is set. Gated on the
  # same `test` job as the binary upload, but NOT on `upload` — a flaky
  # per-platform upload must not block the immutable crate publish, and vice
  # versa. Kept out of release-plz (publish = false there) so versioning/tagging
  # stays decoupled from the registry push.
  publish-crate:
    needs: [guard, test]
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Idempotent: a version already live on crates.io is skipped rather than
      # failing the release, so re-running after a partial failure is safe.
      - name: Publish (skip a version already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # `cargo publish` verifies the packaged crate by building it, which is
          # one more compile the gate never sees the output of.
          RUSTFLAGS: "-D warnings"
        run: |
          ver="$(cargo metadata --no-deps --format-version 1 \
                 | sed -n 's/.*"name":"onepipeline-ui","version":"\([^"]*\)".*/\1/p')"
          if curl -fsSL "https://index.crates.io/on/ep/onepipeline-ui" 2>/dev/null \
             | grep -q "\"vers\":\"$ver\""; then
            echo "onepipeline-ui $ver is already on crates.io; nothing to publish."
            exit 0
          fi
          cargo publish --locked

  # PyPI wheels: maturin's `bin` bindings wrap the prebuilt binary in
  # per-platform wheels (the ruff/uv pattern), so `pip install onepipeline-api-cli`
  # is a seconds-fast binary install anywhere PyPI is reachable — the quickest
  # path on a CI image with no Rust toolchain. maturin-action compiles inside
  # manylinux containers on Linux for broad glibc compatibility, which is why
  # this is a separate matrix from `upload` rather than a step inside it.
  build-wheels:
    name: build-wheels (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the binary `upload` matrix: native runners per target.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        # The gate denies warnings on Linux only; these targets are compiled
        # nowhere else, so deny them here too rather than let a
        # platform-specific one ship unread.
        env:
          RUSTFLAGS: "-D warnings"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          maturin-version: v1.14.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # PyPI publishing activates when the PYPI_PUBLISH repository variable is
  # 'true'. Authentication is the PYPI_TOKEN secret (a project-scoped API token),
  # not Trusted Publishing: this project publishes with repo secrets, so no OIDC
  # identity is registered on PyPI and `id-token: write` would buy nothing.
  # Keeping the wheels' build unconditioned above means a packaging break still
  # reddens the release while publishing is off.
  publish-pypi:
    needs: build-wheels
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Switching PYPI_PUBLISH on is a claim that the credential exists. Say so
      # here rather than letting the upload fail later as an opaque 403 — the
      # live tier must require its credential, not discover it missing.
      - name: Require the publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_PUBLISH is on but the PYPI_TOKEN secret is empty; add it (see gh-secrets.json) or unset PYPI_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
          # Idempotent: a re-run (e.g. to finish a sibling publish) must not
          # red-fail because these wheels are already on PyPI.
          skip-existing: true

  # Post-publish gate: prove the just-published version is pip-installable on
  # every OS a user installs it on. PyPI propagation is not instant, so the
  # install itself retries through scripts/retry-install.sh until the index a
  # user resolves from serves the version, then the real wheel it put on PATH
  # goes to scripts/smoke-published.sh — the same script ci.yml runs against the
  # build under test, so what a release asserts cannot drift from what ships.
  #
  # Four legs for five targets: `pip install` resolves a *different wheel* per
  # platform AND architecture, so the matrix is keyed on the pair, not the OS.
  # `macos-latest` is arm64 — `macos-15-intel` is the leg that installs the
  # `x86_64-apple-darwin` wheel. The one target with no leg is
  # `aarch64-unknown-linux-gnu`: setup-python's arm64 Linux support is not
  # something a release is the place to discover. It is still built by the
  # matrices above and attached to the Release, where `verify-assets` runs it.
  verify-pypi:
    name: verify-pypi (${{ matrix.os }})
    needs: publish-pypi
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke assets, at the tag that was published.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A Release can be cut by hand with any tag, and the version below is
      # sliced straight out of it — so check the shape before it becomes a
      # package specifier. Anything but vX.Y.Z means the Release is not one this
      # pipeline built.
      - name: Check the release tag is a version
        run: |
          # A glob cannot say "digits and nothing else" — `v[0-9]*.[0-9]*.[0-9]*`
          # would take `v1x.2y.3z` — so match the whole tag against a pattern.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # The install is the propagation probe, and the only one: `pip install`
      # resolves through the simple index behind a CDN, which converges later and
      # per edge than the JSON API a separate wait step would poll.
      #
      # `--no-cache-dir` because pip caches the index response it reads: a retry
      # that re-read its own cached "no such version" page would spend the whole
      # budget polling its own memory.
      - name: Install the published wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/retry-install.sh \
            --label "PyPI onepipeline-api-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://pypi.org/project/onepipeline-api-cli/ — publish-pypi may have uploaded no wheel for this platform" \
            -- pip install --no-cache-dir "onepipeline-api-cli==${ver}"
      - name: Smoke-test what PyPI served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "PyPI onepipeline-api-cli $ver on $RUNNER_OS/$RUNNER_ARCH"

  # npm packages: scripts/npm-build.mjs wraps the prebuilt binary in a
  # per-platform package (onepipeline-api-cli-<platform>-<arch>), the direct
  # analogue of the maturin wheels, on the same native-runner matrix as `upload`,
  # then `npm pack`s each to a tarball artifact. Unconditioned for the same
  # reason the wheels are.
  build-npm:
    name: build-npm (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the platform binary
        env:
          TARGET: ${{ matrix.target }}
          # Same reason as the wheels: a warning that only this target emits has
          # no other job to surface it.
          RUSTFLAGS: "-D warnings"
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
      - name: Assemble and pack the platform npm package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/onepipeline-api"
          [ -f "$bin" ] || bin="${bin}.exe"
          pkgdir="$(node scripts/npm-build.mjs platform --target "$TARGET" --binary "$bin" --out npm/dist)"
          mkdir -p npm-artifacts
          (cd "$pkgdir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-artifacts")
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-artifacts/*.tgz

  # npm publishing activates when the NPM_PUBLISH repository variable is 'true'.
  # `registry-url` makes setup-node write an .npmrc that authenticates with
  # NODE_AUTH_TOKEN, so `npm publish` is token-authenticated (an npm automation
  # token with publish rights to onepipeline-api-cli and its platform packages).
  #
  # No `--provenance`: that needs an OIDC-backed attestation whose first
  # successful run cannot be rehearsed anywhere but a real publish, and a
  # provenance failure would take the publish down with it. The packages ship
  # without it rather than risk that; adding it later is a one-flag change plus
  # `id-token: write` on this job.
  publish-npm:
    needs: build-npm
    permissions:
      contents: read
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Same rule as publish-pypi: the live tier requires its credential rather
      # than discovering it missing at the registry. Without this, an empty
      # NODE_AUTH_TOKEN surfaces as an ENEEDAUTH inside publish-npm.sh, after
      # some packages may already be public.
      - name: Require the publishing credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_PUBLISH is on but the NPM_TOKEN secret is empty; add it (see gh-secrets.json) or unset NPM_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The frontend bundle below is built through the repository's own command
      # surface, so this job needs the runner that fans it out.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - name: Publish the platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: the launcher's optionalDependencies pin their
          # exact versions, so they must exist for a later install to resolve.
          # Glob against an ABSOLUTE base so each argument is an absolute path —
          # npm reads a bare `dir/file.tgz` as a `user/repo` GitHub spec and tries
          # to git-clone it.
          for tgz in "$GITHUB_WORKSPACE"/npm-artifacts/*.tgz; do
            bash scripts/publish-npm.sh "$tgz"
          done
          # The launcher carries no binary, so it needs no prebuilt target — just
          # the version-stamped manifest.
          launcher="$(node scripts/npm-build.mjs launcher --out npm/dist)"
          bash scripts/publish-npm.sh "$launcher"
      # The other npm deliverable: the frontend itself, which carries no binary
      # and so has no per-platform packages to publish first. It is built here
      # rather than in the matrix above because one static bundle serves every
      # platform — building it five times would publish whichever won.
      - name: Build the distributable bundles
        run: |
          just build
      - name: Publish the frontend package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ui="$(node scripts/npm-build.mjs ui --out npm/dist)"
          bash scripts/publish-npm.sh "$ui"

  # Post-publish gate: prove the just-published version is npm-installable on
  # every OS a user installs it on, the same promise verify-pypi makes for the
  # wheel and on the same matrix, for the same reasons. Registry propagation is
  # not instant, so the global install retries through scripts/retry-install.sh
  # until it resolves, and the smoke test then drives the real binary its
  # optional dependency pulled in — which is the resolution this job exists to
  # prove, since npm picks a different platform package on each runner.
  verify-npm:
    name: verify-npm (${{ matrix.os }})
    needs: publish-npm
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke assets, at the tag that was published.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check the release tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # Same probe as verify-pypi: the install is what resolves the packument and
      # its platform dependency, so it is what waits for them rather than a
      # separate `npm view` poll that can answer from a different edge.
      # `--prefer-online` for the reason pip gets `--no-cache-dir` — npm will
      # otherwise serve the metadata it cached on the attempt that failed.
      - name: Install the published package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/retry-install.sh \
            --label "npm onepipeline-api-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://www.npmjs.com/package/onepipeline-api-cli — the platform package for this runner may not have published" \
            -- npm install -g --prefer-online "onepipeline-api-cli@${ver}"
      - name: Smoke-test what npm served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "npm onepipeline-api-cli $ver on $RUNNER_OS/$RUNNER_ARCH"

  # The last word on whether this tag means anything. Every job above it can go
  # red without the Release changing at all — a failed `test` *skips* the ten
  # publish and verify jobs rather than failing them — which is how v0.2.0 and
  # v0.3.0 came to have a tag, a Release and attached assets while npm and PyPI
  # still served 0.1.0. This runs whatever happened and makes the Release say it:
  # a release that did not publish becomes a prerelease with a banner naming the
  # jobs, so `releases/latest` and the Latest badge stop pointing at it, and the
  # job fails. `scripts/release-status.sh` holds the logic — it is driven for
  # real, against a recording `gh`, by tests/e2e/release_status.rs.
  #
  # `if: always()` because the whole point is the paths where something did not
  # run. The switches are passed in rather than assumed: a publish job the
  # operator has turned off is not a job this release was waiting for.
  release-status:
    needs:
      - guard
      - test
      - upload
      - verify-assets
      - publish-crate
      - build-wheels
      - publish-pypi
      - verify-pypi
      - build-npm
      - publish-npm
      - verify-npm
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Demoting the Release and rewriting its notes is a write to the release.
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Every value below arrives as an environment variable rather than inside
      # the `run:` string: a job result or a repository variable interpolated
      # into a shell command is a command the workflow did not write.
      - name: Hold the Release to what actually published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          JOB_RESULTS: >-
            test=${{ needs.test.result }}
            upload=${{ needs.upload.result }}
            verify-assets=${{ needs.verify-assets.result }}
            publish-crate=${{ needs.publish-crate.result }}
            build-wheels=${{ needs.build-wheels.result }}
            publish-pypi=${{ needs.publish-pypi.result }}
            verify-pypi=${{ needs.verify-pypi.result }}
            build-npm=${{ needs.build-npm.result }}
            publish-npm=${{ needs.publish-npm.result }}
            verify-npm=${{ needs.verify-npm.result }}
          EXPECT_CRATE: ${{ needs.guard.outputs.publish }}
          EXPECT_PYPI: ${{ vars.PYPI_PUBLISH }}
          EXPECT_NPM: ${{ vars.NPM_PUBLISH }}
        run: bash scripts/release-status.sh
