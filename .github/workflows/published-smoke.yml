name: Published smoke

# Install what the registries and the GitHub Release are serving *right now* and
# run it.
#
# `release.yml`'s verify jobs prove a version at the moment it is published, and
# then never look again. Everything that can break afterwards — a yanked platform
# package, an npm dist-tag moved to a build that never shipped, a wheel PyPI
# stopped serving for one platform — is invisible until a user hits it, because
# nothing in this repository installs from a registry between releases.
#
# So this runs the identical `scripts/smoke-published.sh` those jobs run, against
# `latest` rather than a tag, on Linux, both macOS architectures, and Windows,
# every time `release.yml` finishes. A release is the only thing that changes what
# `latest` resolves to, so that is precisely when the answer can have just become
# wrong — a publish that half-completed, a dist-tag pointed at a build whose
# assets never uploaded — and the registry is asked then rather than on a clock
# with no relationship to when anything changed. The registry's own idea of the
# version (`pip show`, `npm view`) is what the binary is held to, so a package
# whose metadata and payload disagree fails here rather than confusing someone
# reading `--version`.
#
# On `completed` rather than on a successful release: a release run that went red
# partway is the one most likely to have left a registry serving something broken,
# and it is exactly the run whose smoke nobody would think to ask for by hand.
#
# Deliberately cheap: a checkout, the language runtime that owns the installer,
# `pip install` / `npm install -g`, and bash. No Rust toolchain, no build, no
# cache — a sweep that took ten minutes a platform would be the first thing
# switched off, and this one has to keep running while nobody is looking.
#
# NOT a required check, and it cannot become one: branch protection lists
# contexts a *pull request* reports, and neither a completed workflow run nor a
# manual dispatch is one. See AGENTS.md.
#
# A failure therefore has no check to turn red and nobody waiting on it, so the
# `report` job below files it as an issue — one thread, commented on at each
# further failure. That is the whole of the alarm; without it this detects rot
# and tells no one.
#
# llmlint: ignore-file[changed_behavior_has_e2e] what is left here after the
# reporter is the trigger, two registry installs, and calls to
# `scripts/smoke-published.sh` and `scripts/report-workflow-failure.sh`. Both
# scripts hold the behaviour and both are driven for real — the smoke against the
# compiled binary on every pull request by ci.yml's `install` job, the reporter's
# create-versus-comment branch by `tests/e2e/report_workflow_failure.rs`. The
# installs are what only a hosted runner and a live registry can exercise;
# simulating either would put the simulation under test.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] the registry
# reads require no credential: every step reads a public registry anonymously, and
# the jobs are switched by the same PYPI_PUBLISH / NPM_PUBLISH repository
# variables that decide whether this project publishes to those registries at all.
# A repo that publishes nowhere has nothing to smoke, and a red run for an absent
# package is how a sweep gets switched off. The one job that does need a
# credential — `report`, which writes an issue — takes the run's own
# `github.token` and declares the `issues: write` it needs beside it.

on:
  # Every finished run of `release.yml`, whatever it concluded. A release is the
  # only thing that changes what `latest` resolves to, so this asks the registry
  # precisely when its answer can have just become wrong.
  #
  # This matches `release.yml` by its *display name*, and GitHub says nothing
  # when it matches none — a rename would leave this silently never running
  # again, which looks exactly like a smoke that keeps passing. Nothing here can
  # reference that workflow's `name:`, so `tests/packaging.rs` holds the two
  # together instead.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # The manual entry point — after a registry incident, or to confirm a fix
  # without waiting for the next release.
  workflow_dispatch:

# Nothing by default. Each job asks for `contents: read` because it checks out
# the smoke script.
permissions: {}

concurrency:
  group: published-smoke
  cancel-in-progress: false

jobs:
  pypi:
    name: pypi (${{ matrix.os }})
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what PyPI serves as latest
        run: pip install --no-cache-dir onepipeline-api-cli
      # The registry's own metadata is the expectation, so a package whose
      # recorded version and shipped binary disagree fails here.
      - name: Smoke-test it against the version PyPI recorded
        run: |
          ver="$(pip show onepipeline-api-cli | awk '/^Version:/ {print $2}')"
          [ -n "$ver" ] || { echo "::error::pip reported no version for onepipeline-api-cli"; exit 1; }
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "PyPI onepipeline-api-cli latest ($ver) on $RUNNER_OS/$RUNNER_ARCH"

  npm:
    name: npm (${{ matrix.os }})
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install what npm serves as latest
        run: npm install -g --prefer-online onepipeline-api-cli
      - name: Smoke-test it against the version npm recorded
        run: |
          ver="$(npm view onepipeline-api-cli version)"
          [ -n "$ver" ] || { echo "::error::npm reported no version for onepipeline-api-cli"; exit 1; }
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "npm onepipeline-api-cli latest ($ver) on $RUNNER_OS/$RUNNER_ARCH"

  # The other thing a registry serves, and the other thing that can rot between
  # releases: the answer a *consumer* gets when it asks whether the release it is
  # waiting on has happened. `release-targets.toml` declares what this repository
  # publishes and `scripts/release-probe.sh` answers for one of those names;
  # `tests/e2e/release_probe.rs` drives every way that probe can fail to answer,
  # but the two answers it can only get from a live public registry — the version
  # one serves, and the emptiness of one that has never released a name — cannot
  # be in the deterministic gate, which is offline. They are here, for the same
  # reason the installs above are: nothing else in this repository asks a registry
  # anything between releases.
  #
  # Ungated, unlike the two jobs above. A probe that answers is what a consumer
  # depends on whether or not this repository is publishing today, and the one
  # thing this must never do is report "no release yet" for a registry it could
  # not reach — so the read itself is exercised on every sweep, and only the
  # expectation of a *version* follows the operator's publishing switches.
  probe:
    name: probe
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Spawned as a direct subprocess, the way the release-target contract says
      # a consumer spawns it — no `bash` in front, so the execute bit and the
      # `#!` line are part of what this proves.
      - name: What each declared release target is serving right now
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          # Read the declaration into a value before probing anything, so a
          # declaration that is missing, unparseable, or shaped wrong fails this
          # step. Streamed straight into the loop it would not: the loop would
          # read nothing, probe nothing, and report green — a sweep that verified
          # no target while saying every target was fine.
          # Read with a standard TOML parser and no knowledge of this repository,
          # the way the consumer this document is written for reads it: `tomllib`
          # is in Python's standard library, and a declaration this cannot list
          # every target out of is one no consumer could either. Handed over as a
          # heredoc rather than as `python3 -c`, because YAML strips this block's
          # indentation and Python refuses a program that still carries any.
          ids="$(python3 - <<'READ_DECLARATION'
          import tomllib

          with open("release-targets.toml", "rb") as document:
              declared = tomllib.load(document).get("target")
          if not isinstance(declared, list) or not declared:
              raise SystemExit("release-targets.toml declares no release target to probe")
          for target in declared:
              identifier = target.get("id")
              if not isinstance(identifier, str) or identifier.split(":")[0] not in ("crate", "pypi", "npm"):
                  raise SystemExit(f"not a registry-qualified target id: {identifier!r}")
              print(identifier)
          READ_DECLARATION
          )"
          [ -n "$ids" ] || { echo "::error::release-targets.toml yielded no target to probe"; exit 1; }
          failed=0
          while read -r id; do
            if ! served="$(scripts/release-probe.sh "$id")"; then
              echo "::error::the probe could not establish what $id is serving"
              failed=1
              continue
            fi
            case "${id%%:*}" in
              # crates.io publishing has no switch of its own — it activates with
              # the CARGO_REGISTRY_TOKEN secret, and this repository's crate is
              # live.
              crate) live=true ;;
              pypi) [ "${PYPI_PUBLISH:-}" = "true" ] && live=true || live=false ;;
              npm) [ "${NPM_PUBLISH:-}" = "true" ] && live=true || live=false ;;
              *) echo "::error::$id names a registry this workflow cannot switch on"; failed=1; continue ;;
            esac
            if [ -n "$served" ]; then
              echo "$id -> $served"
            elif [ "$live" = "true" ]; then
              echo "::error::$id is published from this repository, and its registry serves no release of it"
              failed=1
            else
              echo "$id -> nothing yet (this repository is not publishing to that registry)"
            fi
          # A here-string, which terminates its last line: `read` drops an
          # unterminated one, and that would silently leave a declared target
          # unprobed.
          done <<< "$ids"
          [ "$failed" -eq 0 ]
      # The answer a consumer must be able to tell from the ones above, and the
      # only place a real registry can give it: a name no registry has ever
      # released is an *answer*, so it exits 0 with nothing at all.
      - name: A name no registry has released is answered, and answered empty
        run: |
          failed=0
          for id in crate:onepipeline-ui-has-never-been-published \
                    pypi:onepipeline-ui-has-never-been-published \
                    npm:onepipeline-ui-has-never-been-published; do
            if ! served="$(scripts/release-probe.sh "$id")"; then
              echo "::error::the probe could not reach the registry for $id"
              failed=1
              continue
            fi
            if [ -n "$served" ]; then
              echo "::error::$id was answered '$served'; someone now holds that name, so pick another sentinel"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
      # And the distinction the whole mechanism turns on, asserted on the same
      # runner that just produced two empty answers: a target the probe cannot
      # answer for must not look like one that has no release.
      - name: An identifier the probe cannot answer is refused, not answered empty
        run: |
          failed=0
          for id in onepipeline-ui docker:onepipeline-ui "npm:Not A Package"; do
            if served="$(scripts/release-probe.sh "$id" 2>/dev/null)"; then
              echo "::error::'$id' was answered '${served:-<nothing>}' rather than refused"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

  # Where a failure goes. Neither trigger above is a pull request, so nothing
  # here turns a check red and nobody is waiting on the answer — which is how a
  # sweep spends months detecting a real publication defect and telling no one.
  #
  # One open issue, commented on at each further failure, so a run of bad
  # releases is one thread rather than one issue apiece. It reports on a manual
  # dispatch too: a human who ran it by hand has already seen the red, and the
  # thread is the same thread either way, so filing is cheaper than reasoning
  # about which trigger deserves an alarm.
  #
  # `needs` lists every job that can fail; `failure()` is false when they were
  # all skipped, which is what a repository publishing nowhere looks like.
  report:
    name: report a failure
    needs: [pypi, npm, probe]
    if: >-
      failure() && github.repository == 'nickderobertis/onepipeline-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      # The reporter is a file in this repository, so the job that runs it has
      # to have this repository in its workspace — a reporting job without this
      # step fails on the one run it exists for.
      - uses: actions/checkout@v4
      - name: Open or update the published-smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: Published smoke is failing
          BODY: >-
            The published smoke failed. It installs what PyPI and npm serve as
            `latest` on Linux, both macOS architectures and Windows, and asks
            every declared release target what its registry is serving; open the
            run to see which legs failed. This runs after a release completes,
            so the first thing to rule out is the release that just finished
            leaving a registry serving something that does not work.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A script, not inline YAML: the create-versus-comment branch is real
        # behaviour, and `tests/e2e/report_workflow_failure.rs` drives both
        # halves against a stand-in `gh`. This path only ever runs when
        # something is already broken, so it cannot debug itself in place.
        run: bash scripts/report-workflow-failure.sh
