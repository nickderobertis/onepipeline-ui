name: CI cache

# Keep the Rust build warm that ci.yml's four pull-request jobs restore. Those
# jobs restore and never save, so the repository's Actions cache holds main's
# builds and no pull request's: one build-only job per OS here compiles what that
# OS's pull-request jobs compile (`scripts/ci-warm.sh` holds the list), runs no
# test, and saves under the key those jobs restore — `test-linux` for `lint` and
# `test-linux`, `test-windows` for `test-windows`, `test-macos` for `test-macos`.
# Each restores its own previous save first, so a push rebuilds only what it
# changed.
#
# The keys carry the names main's own builds were saved under before this
# workflow existed, when each pull-request job saved its build keyed by its job
# id (`v0-rust-test-linux-…`, `v0-rust-test-windows-…`). So a pull request opened
# before this workflow first runs restores those, and the first push here
# restores them too. rust-cache never re-saves a key it restored exactly, and
# drops the workspace's own crates before saving, so the entry it keeps is the
# dependency build for one Cargo.lock: this workflow writes a new one each time
# the lockfile or the toolchain moves.
#
# It is also what catches a merge that breaks `main`: branch protection does not
# require a branch to be up to date and nothing re-runs the tests on a push, so a
# job here fails when `main` does not compile. It is not a pull-request check.
#
# Beside the warm jobs, `advisories` runs the informational advisories report on
# each push to `main` (.github/required-contexts.mjs); it builds nothing and no
# job needs it.
#
# It saves the two clone-local binaries the jobs provision too — the sibling CLI
# on every OS and, on Linux, the server of the commit pull requests fork from —
# under the keys ci.yml restores them by.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One warm build of `main` at a time; a push landing behind a running one waits,
# and a third replaces the second rather than queueing behind it.
concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: false

# ci.yml's own workflow environment: rust-cache hashes these variables into its
# key, so the key saved here is the key ci.yml restores.
env:
  CARGO_TERM_COLOR: always

jobs:
  warm-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deleting this family's superseded copies; only the cleanup step is handed the token.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The base server is built from the commit this push leaves `main` at,
          # resolved as `git merge-base HEAD origin/main`.
          fetch-depth: 0
          # No step here reads a remote through this checkout, and the build runs
          # beside a token that can delete caches.
          persist-credentials: false
      # The exact versions of the tools this job installs (.github/ci-tool-versions).
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      # Ahead of the MSRV toolchain, as in ci.yml's `lint`: rust-cache hashes the
      # installed toolchains and dtolnay's CARGO_* exports into the key it saves.
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
        with:
          shared-key: test-linux
      # A lock or toolchain move restores the previous copy, whose units for the old
      # lock rust-cache would save again: build cold so the new copy holds this lock's.
      - name: Drop a restored build that is not this key's own
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rm -rf target
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }}
      - name: What the provisioned binaries are built from
        id: pins
        run: |
          echo "onepipeline=$(just --evaluate onepipeline-version)-$(just --evaluate onepipeline-source | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "base=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"
      - name: Restore the sibling CLI
        id: sibling
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline
            .tools/bin/onepipeline.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Restore the base commit's server
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline-api-baseline
            .tools/bin/onepipeline-api-baseline.commit
          key: onepipeline-api-baseline-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.base }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-baseline-api.sh') }}
      - name: Bootstrap
        run: just bootstrap
      - name: Save the sibling CLI
        if: steps.sibling.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/bin/onepipeline
            .tools/bin/onepipeline.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Build the base commit's server
        if: steps.baseline.outputs.cache-hit != 'true'
        run: bash scripts/nx.sh run onepipeline-ui:ensure-baseline
      - name: Save the base commit's server
        if: steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/bin/onepipeline-api-baseline
            .tools/bin/onepipeline-api-baseline.commit
          key: onepipeline-api-baseline-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.base }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-baseline-api.sh') }}
      - name: Build the browser view the binary embeds
        run: just build
      - name: Compile what lint and test-linux compile
        run: just ci-warm-linux
      # The last ordinary step, so it runs before rust-cache's post step saves and cannot
      # see that save: each family keeps its previous copy until the next push's cleanup.
      - name: Delete this leg's superseded cache copies
        run: >-
          node scripts/actions-cache-prune.mjs
          --family v0-rust-test-linux-Linux-x64-
          --family onepipeline-cli-Linux-X64-
          --family onepipeline-api-baseline-Linux-X64-
          --family v0-rust-release-plz-Linux-x64-
        env:
          GH_TOKEN: ${{ github.token }}

  warm-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # Deleting this family's superseded copies; only the cleanup step is handed the token.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # No step here reads a remote through this checkout, and the build runs
          # beside a token that can delete caches.
          persist-credentials: false
      # The exact versions of the tools this job installs (.github/ci-tool-versions).
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
        with:
          shared-key: test-windows
      # A lock or toolchain move restores the previous copy, whose units for the old
      # lock rust-cache would save again: build cold so the new copy holds this lock's.
      - name: Drop a restored build that is not this key's own
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rm -rf target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }}
      - name: What the provisioned sibling is built from
        id: pins
        run: echo "onepipeline=$(just --evaluate onepipeline-version)-$(just --evaluate onepipeline-source | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore the sibling CLI
        id: sibling
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline.exe
            .tools/bin/onepipeline.exe.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Bootstrap
        run: just bootstrap
      - name: Save the sibling CLI
        if: steps.sibling.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/bin/onepipeline.exe
            .tools/bin/onepipeline.exe.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Build the browser view the binary embeds
        run: just build
      - name: Compile what test-windows compiles
        run: just ci-warm-windows
      # The last ordinary step, so it runs before rust-cache's post step saves and cannot
      # see that save: each family keeps its previous copy until the next push's cleanup.
      - name: Delete this leg's superseded cache copies
        run: >-
          node scripts/actions-cache-prune.mjs
          --family v0-rust-test-windows-Windows_NT-x64-
          --family onepipeline-cli-Windows-X64-
        env:
          GH_TOKEN: ${{ github.token }}

  # Not on the push that merges release-plz's release pull request: that commit
  # changes the version and the changelog alone, and a Mac job there is one more
  # Mac run a release would start (.github/budgets.yaml).
  warm-macos:
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: macos-latest
    timeout-minutes: 60
    # Deleting this family's superseded copies; only the cleanup step is handed the token.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # No step here reads a remote through this checkout, and the build runs
          # beside a token that can delete caches.
          persist-credentials: false
      # The exact versions of the tools this job installs (.github/ci-tool-versions).
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
        with:
          shared-key: test-macos
      # A lock or toolchain move restores the previous copy, whose units for the old
      # lock rust-cache would save again: build cold so the new copy holds this lock's.
      - name: Drop a restored build that is not this key's own
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rm -rf target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-pins.outputs.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},nextest@${{ steps.tool-pins.outputs.nextest }},cargo-llvm-cov@${{ steps.tool-pins.outputs.cargo-llvm-cov }},cargo-auditable@${{ steps.tool-pins.outputs.cargo-auditable }}
      - name: What the provisioned sibling is built from
        id: pins
        run: echo "onepipeline=$(just --evaluate onepipeline-version)-$(just --evaluate onepipeline-source | git hash-object --stdin | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Restore the sibling CLI
        id: sibling
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/bin/onepipeline
            .tools/bin/onepipeline.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Bootstrap
        run: just bootstrap
      - name: Save the sibling CLI
        if: steps.sibling.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/bin/onepipeline
            .tools/bin/onepipeline.source
          key: onepipeline-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.onepipeline }}-${{ hashFiles('rust-toolchain.toml', 'scripts/ensure-sibling.sh') }}
      - name: Build the browser view the binary embeds
        run: just build
      - name: Compile what test-macos compiles
        run: just ci-warm-macos
      # The last ordinary step, so it runs before rust-cache's post step saves and cannot
      # see that save: each family keeps its previous copy until the next push's cleanup.
      - name: Delete this leg's superseded cache copies
        run: >-
          node scripts/actions-cache-prune.mjs
          --family v0-rust-test-macos-Darwin-arm64-
          --family onepipeline-cli-macOS-ARM64-
        env:
          GH_TOKEN: ${{ github.token }}

  # The advisories report on `main` (.github/required-contexts.mjs). It stands
  # alone: no job needs it, so its red never holds a warm job or a release.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The report reads the base (`git merge-base HEAD origin/main`, here
          # this commit) to say which advisories were already there.
          fetch-depth: 0
      # The exact versions of the tools this job installs (.github/ci-tool-versions).
      - name: Read the pinned tool versions
        id: tool-pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
            /^[a-z0-9-]+=[A-Za-z0-9._+-]+$/ { print; next }
            { print "malformed pin: " $0 > "/dev/stderr"; exit 1 }
          ' >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: just@${{ steps.tool-pins.outputs.just }},cargo-deny@${{ steps.tool-pins.outputs.cargo-deny }},cargo-machete@${{ steps.tool-pins.outputs.cargo-machete }}
      - name: Advisories report (informational)
        run: just advisories-report
