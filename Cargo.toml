[package]
name = "onepipeline-ui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Read API and browser view for onepipeline runs — the HTTP contract an axum server wrapping the onepipeline SDK serves."
license = "MIT"
repository = "https://github.com/nickderobertis/onepipeline-ui"
homepage = "https://github.com/nickderobertis/onepipeline-ui"
readme = "README.md"
keywords = ["cli", "api", "telemetry", "observability", "onepipeline"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
# Package what a consumer receives: the sources, manifest, readme, license, and
# the contract the crate's types are the Rust rendering of — `docs/contract.md`
# is the source of truth `tests/contract.rs` reconciles the route table against,
# so a consumer reading the crate can read the contract beside it.
#
# release-plz decides a package changed by diffing its **packaged files** against
# the last release, so anything a consumer receives at the tag belongs here.
# Excludes the CLAUDE.md/AGENTS.md symlink (registries reject symlinks), CI
# config, the scripts, and the fixtures.
#
# Anchored with a leading `/` where a bare name would also match a nested one.
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "/docs/contract.md",
]

# The command an operator types. Deliberately not the crate name: the crate and
# the npm package of built frontend assets are both `onepipeline-ui`, and only
# one of them can own a command called that. This binary serves the read API, so
# it is `onepipeline-api` — `tests/packaging.rs` holds every distribution to it.
[[bin]]
name = "onepipeline-api"
path = "src/main.rs"

[lib]
name = "onepipeline_ui"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
onepipeline = "0.1.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, which is what lets
# a served payload round-trip byte for byte against the checked-in fixtures the
# contract tests compare to `docs/contract.md`.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-stream = "0.1"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
predicates = "3"
tempfile = "3"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
