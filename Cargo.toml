[package]
name = "onepipeline-ui"
version = "0.24.1"
edition = "2021"
# The floor is the engine's: a consumer cannot build this crate under a rustc
# `onepipeline` refuses, so this moves with the `onepipeline = "=..."` line
# below — 0.56.0 declares 1.97 — and `clippy.toml` mirrors it so clippy
# suggests nothing newer.
rust-version = "1.97"
description = "Read API and browser view for onepipeline runs — the HTTP contract an axum server wrapping the onepipeline SDK serves."
license = "MIT"
repository = "https://github.com/nickderobertis/onepipeline-ui"
homepage = "https://github.com/nickderobertis/onepipeline-ui"
readme = "README.md"
keywords = ["cli", "api", "telemetry", "observability", "onepipeline"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
# The packaged set has two jobs, and the second is why it reaches outside the
# crate. It is what a crates.io consumer receives — and it is the *only* signal
# release-plz gives us that a release is due: release-plz diffs a package's
# packaged files against the last release, and opens no release PR when none of
# them changed.
#
# This repository publishes more than the crate. One version stamps the
# `onepipeline-api-cli` wheels and npm packages (the compiled binary) *and* the
# `onepipeline-ui` npm package (the built frontend bundle). A UI-only change
# therefore changes a published artifact, and unless the files it touched are
# listed here it silently never releases — which is exactly how v0.2.0 and
# v0.3.0 stranded. So this lists every file whose **bytes reach a published
# artifact**: the Rust sources, the committed manifests and launcher shim the
# wrappers ship verbatim, the script that writes the generated manifests (the
# platform packages have no committed manifest — it is their only source), and
# the frontend's build inputs.
#
# The price is that the crate tarball carries the frontend sources, which
# `cargo build` never reads. That is deliberate: a consumer downloading the crate
# at a tag gets the whole of what that tag published, and a release that ships UI
# changes stays releasable by UI changes. `tests/packaging.rs` holds the set to
# that rule.
#
# What stays out: the CLAUDE.md/AGENTS.md symlink (registries reject symlinks),
# the fixtures and suites, and the workflows. A workflow contributes no bytes to
# an artifact — it selects targets, which the launcher's committed
# `optionalDependencies` already record — so a CI change that alters nothing a
# user installs must not cut a version.
#
# Anchored with a leading `/` where a bare name would also match a nested one.
include = [
  # The read API itself: what crates.io serves, and what every prebuilt binary
  # in the wheels and the npm platform packages is compiled from — the build
  # script included, since it is what puts the browser view inside that binary.
  "/src/**/*.rs",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  # The contract the crate's types are the Rust rendering of — the source of
  # truth `tests/contract.rs` reconciles the route table against, so a consumer
  # reading the crate can read the contract beside it.
  "/docs/contract.md",

  # The wrappers' own published bytes: the wheel's metadata, the committed npm
  # manifests and the launcher shim they ship verbatim, and the script that
  # assembles the generated per-platform manifests.
  "/pyproject.toml",
  "/npm/onepipeline-api-cli/package.json",
  "/npm/onepipeline-api-cli/bin/**",
  "/npm/onepipeline-ui/package.json",
  "/npm/onepipeline-ui/README.md",
  "/scripts/npm-build.mjs",
  # The one build of every Linux wheel: its image, the prerequisites it installs
  # there and the maturin invocation are what decide those wheels' bytes, and a
  # change to it has to be able to cut the release that publishes them.
  "/scripts/build-linux-wheel.sh",

  # The frontend bundle the `onepipeline-ui` npm package carries: its sources,
  # the workspace libraries Vite inlines into it, the config that decides what is
  # emitted, and the lockfile that pins what gets inlined.
  "/apps/dag-ui/index.html",
  "/apps/dag-ui/src/**",
  "/apps/dag-ui/package.json",
  "/apps/dag-ui/tsconfig.json",
  "/apps/dag-ui/vite.config.ts",
  "/packages/*/src/**",
  "/packages/*/package.json",
  "/packages/*/tsconfig.json",
  "/tsconfig.base.json",
  "/package.json",
  "/package-lock.json",
]

# The command an operator types. Deliberately not the crate name: the crate and
# the npm package of built frontend assets are both `onepipeline-ui`, and only
# one of them can own a command called that. This binary serves the read API, so
# it is `onepipeline-api` — `tests/packaging.rs` holds every distribution to it.
[[bin]]
name = "onepipeline-api"
path = "src/main.rs"

[lib]
name = "onepipeline_ui"
path = "src/lib.rs"

# `build.rs` embeds the built browser view (`apps/dag-ui/dist`) in the binary,
# so `onepipeline-api serve --ui` serves the DAG Observatory of this release
# from the one artifact a host installs. Without this feature a build embeds
# the view when it has been built and refuses `--ui` at run time when it has
# not — which is what lets a `cargo check`, a clippy run or a `cargo install`
# from crates.io need no frontend toolchain. With it, a missing view is a build
# error: every prebuilt distribution `release.yml` builds turns it on after
# building the view, so a release that stopped building the bundle before the
# binary fails there rather than shipping an `--ui` nobody can use.
# `tests/packaging.rs` holds every job that compiles the binary to that.
[features]
bundled-ui = []

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
# Exact, not a range: `just bootstrap` provisions the `onepipeline` CLI at the
# version the lock pins this library to, because the two speak a versioned
# telemetry document. Everyone resolving this crate without that lockfile has to
# reach the same version — a crates.io consumer, and cargo-semver-checks, which
# reads the public surface through a generated manifest of its own. Bump it with
# the sibling CLI, as one change — and with `tests/fixtures/healthz.json`, which
# pins the release `/healthz` reports off `onepipeline::VERSION`.
# Move it only with `oneagentgraph`: this crate reads the store whose pointer that
# library writes, and a requirement string cannot say "the same release" — so
# `tests/packaging.rs` reconciles the two edges the lockfile records instead.
# Why the store is linked at all, and read without a lock: `src/AGENTS.md`.
oneharness-core = "0.24.0"
# The run record `oneagentgraph` writes for every graph it runs, linked rather
# than re-read by hand: a session's `agent_role` is served only where that
# record's `declared_members` names the member the session was stamped with, so
# the lane vocabulary is the run's own rather than a list kept here. Held at the
# major `onepipeline` itself resolves — the record this reads was written by the
# release the engine links — and never moved on its own: `tests/packaging.rs`
# reconciles the two edges the lockfile records.
oneagentgraph = "0.5.5"
# The document a settled member's report *is*, linked rather than copied — why,
# and why it is unpinned, is in `src/AGENTS.md`.
onejudge = "0.17.1"
# The correlation a channel reply is answered under is that library's own
# token, parsed by its own parser: `POST .../channel/reply?correlation=C` hands
# the query through `onemessagebus::Correlation` rather than a copy of its
# grammar. Held at the version the SDK's own requirement resolves to, so one
# copy of this library is linked rather than two; `tests/packaging.rs`
# reconciles the edges the lockfile records.
onemessagebus = "0.9.0"
# This crate's own public surface is made of this library's types:
# `error::ApiError::from_engine` and `from_engine_unscoped` take an
# `onepipeline::Error`,
# `filter::EventFilter::to_engine` returns an `onepipeline::filter::EventFilter`,
# `payload::status` takes an `onepipeline::verbs::RunStatus`, and
# `telemetry::of_run` takes an `onepipeline::views::RunView`. A consumer naming
# any of those holds this library's own type, so a requirement crossing its
# semver boundary — a minor, while it is `0.x` — stops that consumer compiling
# against this crate whatever this crate's signatures did. Moving this line is a
# breaking change of *this* crate's and is announced as one; the reading beside
# it cannot notice, because both sides' rustdoc still spells the path
# `onepipeline::Error` while the type behind it changed identity, so
# `scripts/semver-check.sh` refuses a release that moved this line while the
# commits release-plz versions from announce no break.
#
# 0.51.0 links the onetaskgraph store (`onetaskgraph-core` and its plugins)
# where earlier releases spawned an `onetaskgraph` executable, so the driver an
# adoption retains reads and projects a run's plan store in process. That family
# arrives only through this line, pinned exactly by the engine, and this crate's
# own source names none of it.
# Its github-projects and linear plugins reach reqwest's native TLS, so a build
# of this crate compiles OpenSSL from source through `openssl-src` and needs
# `make` beside a C compiler — why visual-docs.yml's capture job installs it.
#
# 0.52.0 adds host-owned task templates: `start` resolves a `template_root` and
# `require_rendered` (launch-config schema 12), holds the plan to them, and
# retains both in the launch record. Adoption reloads no plan from the store and
# runs no rendered-only check, so a browser-adopted run keeps what its launch
# recorded, and nothing here reads either setting.
#
# 0.52.1 lands a change to an item the run's landed baseline
# (`writeback-landed.json`) already holds through a targeted update naming only
# the fields that changed, where 0.52.0 copied the project. A browser-adopted
# run's driver is this line's copy of the engine, so it spends only on what
# changed once this moves; this crate reads neither that file nor the
# projection record.
#
# llmlint: ignore-block[changed_behavior_has_e2e] the re-dispatch, the destination-scoped
# ids, the cut-short sweep, the discharged decisions, the native and paged board searches, the copy
# links and digests, the reused retirement verdicts and the sessions opened over a base conflict below are the engine's behaviour, composed by no code of this crate's — the reply
# route hands a retry or a drop to the engine as the envelope's bytes, and nothing here builds
# a re-dispatch, publishes a branch, sweeps a pool, settles a decision, queries or pages a board or
# copies a project — and the engine's own suites prove them. What this crate owes for the
# move is that a browser-adopted run is driven by that engine, which the named journey proves end to end through the one behaviour a
# scripted turn can hold open.
# 0.53.0 delivers a manager's live note off the run's single writer: a note
# waiting on a turn that takes it only as it ends no longer holds the run's
# journal, so the turn's work and its member's heartbeat go on being recorded
# and the run goes on reading as live. It also names, in a `checks-failed`
# re-dispatch, the commit the node's branch is published at and requires new
# commits on top of it, and adds `onepipeline status --no-providers` and
# `watch --log PATH`, CLI shapes a host can allowlist, which nothing here
# calls. 0.53.1 links the onetaskgraph release that gives a copied
# project's tasks destination-scoped ids. A browser-adopted run is driven by this
# line's copy of the engine, so it carries each of these once this moves;
# `a_note_waiting_on_an_adopted_runs_held_turn_leaves_the_run_journalling_and_live`
# holds the first through the adopt and reply routes.
#
# 0.53.2 has a closing driver finish the identity its maintenance sweep is on
# and stop before the next, journalling the pass as cut short, and answers a
# blocking decision about a node a committed retry or drop removed rather than
# leaving it pending. 0.53.3 links the onetaskgraph release whose store answers
# text, metadata and origin queries with GitHub's own search rather than reading
# the whole board for each, and whose copies record where an item was copied to
# and follow that link on every later copy. A browser-adopted run's driver is
# this line's copy of the engine, so its sweep stops, its stale decisions clear
# and its board checks and copies spend only on what they ask once this moves.
# This crate serves the journal, the decisions and the results those write
# through the linked SDK as it finds them, and names neither a board query nor a
# copy.
#
# 0.54.0 links the onevcs release whose idle retirement pass records each
# branch's verdict and reuses it while that branch's inputs are unchanged, reads
# the remote's refs in bulk rather than one query per branch, and asks no
# existence or ancestry question twice. A browser-adopted run's driver is this
# line's copy of the engine, so its idle sweep re-derives only the verdicts
# whose branches moved once this moves. The `branches-retired` record reads as
# it did, since it never said how a verdict was reached, and this crate serves
# it as the journal holds it. It also adds a stop guard that holds a session's
# owed runs to a wake budget, a hook surface nothing here calls, and with it a
# closure rule that does reach this crate: a run a 0.54 driver drove is owed
# until it is closed — stopped, given a verdict whose `completion` is true, or
# acknowledged — rather than once its graph completes. A browser-adopted run is
# driven by this line's copy of the engine, so `GET /api/v2/unwatched` goes on
# reporting it after its graph settles until one of those closes it; the route
# forwards the verb's answer unfiltered, and
# `holds the watch as a stream, and the unwatched badge changes while it is held`
# reads it beside a run an earlier journey adopted and completed.
#
# 0.55.0 links oneagentgraph 0.5.4, onejudge 0.17.0 and oneharness-core 0.21.0,
# whose streams carry what an agent *said* beside what it did: a turn's
# `turn-activity` and its report's harness history now hold `message` and
# `reasoning` entries under those kinds as well as tool calls and observations.
# A conversation turn serves them as its `assistant` and `reasoning` rather
# than as tool events (`src/payload.rs`, `Words`). It also journals
# `concurrent-deferred` when a launch's cross-DAG dependency acknowledges the
# holder it waits on, and its `watch` wakes on every planner surface and ends
# with a `blocking` flag on its `returned` frame, which
# `GET /api/v2/runs/{run}/watch` forwards as the SDK renders it.
#
# 0.56.0 lets a repository's template layer extend the host's and replace only
# the blocks it names, recording the layers it resolved through as a `chain` on
# `templates::ResolvedTemplate`; this crate serves no template route and reads
# no template. It links oneagentgraph 0.5.5, onejudge 0.17.1 and oneharness-core
# 0.24.0, whose history is indexed in dated pointer segments under `.index.d/`:
# recording a run appends to its day's segment and reads no index and walks no
# store, so a run this line's engine drives costs the same however much history
# the host holds. The session artifact route resolves a session by its own
# project and file and nothing else; `serves a recorded session without
# reading an index or walking the history store` holds both halves under a
# trace. `read_session_display` returns typed entries rather than JSON values,
# so a harness session artifact is picked out as the `Record` entry whose
# `history_id` it names — an in-flight run, which carries no such id, was never
# one — and serialized as before. A browser-adopted run's driver is this line's
# copy of the engine, so its templates resolve through those layers once this
# moves.
#
# 0.57.0 links the onevcs 0.36 release whose publication opens every remote
# lifecycle change request as a draft and watches its required checks under
# every policy — `change-open` included, so red checks there are now a
# `checks-failed` retry rather than an open change. A green `change-open` change
# whose approvals are required stays a draft for its own user's review, and the
# node settles `done` with the outcome `change-review-draft` and its change
# request URL, which `graph.node_results` and the node's publication serve as
# they serve a `change-open` settlement. That release journals `change-drafted`
# with `kind: "awaiting-checks"`, `checks-settled` (`passed`, or
# `passed-with-skipped`), `draft-lifted-early` and `draft-kept-for-review`, and
# classifies each `change-check` into a `state` in which a skipped check is never
# a passed one; timeline schema 11 serves each as a `review`, and
# `a_green_change_kept_a_draft_for_review_is_served_done_with_its_change_request`
# holds them. A browser-adopted run's driver is this line's copy of the engine,
# so its publications follow that lifecycle once this moves.
#
# 0.57.1 changes only the engine's own tests. 0.57.2 links onetaskgraph 0.2.54,
# whose `github-projects` store sends a board's text, metadata, project-name and
# comment-activity searches in pages of twenty and sends a further page only
# while the caller still needs rows, so a caller's limit bounds what is fetched
# as well as what is returned; and 0.2.53, whose copy keeps a rendered
# document's recorded body digest true of the rendering once it rewrites that
# document's references. A browser-adopted run's driver is this line's copy of
# the engine, so its board reads spend only on the pages their answer needs once
# this moves. This crate names neither a board search nor a copy, and its
# `onetaskgraph-*` requirements below move with this line so the lock links the
# one copy of that family the engine pins.
#
# 0.57.3 links onevcs 0.37, which opens a session continuing a branch whose
# moved base conflicts with it by leaving the merge in progress for the session
# to conclude, and says so in an optional `conflict` on `session-opened` — the
# unmerged `paths`, the `base_commit` merged in and the `branch_tip` before it —
# with no new kind. The engine dispatches the worker into that session with a
# merge-resolution criterion and raises `session-conflict` only once its
# publication budget is spent. A browser-adopted run's driver is this line's
# copy of the engine, so its conflicts go back to the worker once this moves.
# This crate reads no conflict and serves the record as journalled;
# `a_session_opened_on_a_conflicted_merge_is_served_as_the_engine_journalled_it`
# holds that through the event, channel and timeline routes.
#
# 0.57.3 also makes a correlated verdict the ruling on the question it names,
# whether the run is live or settled: `POST /api/v2/runs/{run}/channel/reply?correlation=C`
# delivers it to that question's listener through the bus's binding on a
# settled run too, answering the engine's `delivered` receipt, and never journals
# it as the run's `completion-requested`, however its `completion` is spelled; a
# correlation the run never raised is refused. The route's request and receipt
# shapes are unchanged, and
# `a_correlated_verdict_on_a_settled_run_reaches_its_listener_and_requests_no_completion`
# holds it.
#
# 0.60.0 runs one plan across its home project and the member projects the home
# names at `onetaskgraph.members`, each naming its home at
# `onetaskgraph.member_of`, and links onetaskgraph 0.2.57, which carries that
# membership, repository routing that files a task into the member project of
# the source its repository routes to, and the Linear plugin's `status_mapping`.
# A browser-adopted run's driver is this line's copy of the engine, so once this
# moves it reads a plan across its home and member projects in different
# sources, holds a dependency between two of them as one edge of one graph, and
# writes each settlement back where its task lives: the task record of a
# member's task names its own `source`, and the landed baseline names each
# item's destination in that source.
# `an_adopted_run_settles_a_plan_spanning_two_sources_where_each_task_lives`
# holds that through `POST /api/v2/runs/{run}/adopt`. This crate reads no
# membership, and its `onetaskgraph-*` requirements below move with this line.
#
# Between 0.57.3 and 0.60.0 the engine journals `driver-exited`, a driver's
# account of how it let go of a run, which the browser files under `lifecycle`
# beside `driver-adopted`; reads an undriven run's ending off its run-end hook
# verdict, so a run whose one human action is outstanding reads `PAUSED` where it
# read `DRIVER DEAD` and a stopped one `ENDED stopped`, words `state` serves as
# the engine spells them; and gives `drop` an optional `reason`, which the
# browser's reply schema carries. A row's `state` is now read through
# `views::standing_word_of`, the bounded twin of the fold's `liveness_word`, so
# the row and the fold still give one word for one run.
#
# 0.60.1 reads a live, quiet driver as `PARKED` — a run that is driven, never one
# nothing drives — which `RUN_LIVENESS_NOTHING_DRIVING` in the browser already
# excludes, and requires nothing else of this crate. With it, `state` serves
# `ended-failed` for a graph that converged with a node `failed` while its
# `liveness` stays the driver's `DRIVER DEAD`;
# `a_run_that_ended_is_served_as_ended_beside_its_driver_liveness` holds the
# endings to the CLI, and `tests/contract.rs`'s
# `a_row_read_from_the_summary_is_the_row_a_fold_produces` holds the row to the
# fold over a failed, a stopped and a paused run.
#
# 0.60.1 also publishes a schema for every pipeline payload, registered under
# `agent.pipeline.<kind>@2` in `payload::registry()` and named per kind by
# `payload::schema_of`. Every pipeline record an e2e journey serves is held to
# it once its server stops (`tests/support/journal_schema.rs`), so a fixture
# written by hand cannot drift from what the engine journals. Holding them to it
# showed `release-adopted` spells its next-dispatch delivery `next`, never
# `deferred`.
#
# 0.60.2 lets a cancel or a retry interrupt a publication watch, so a
# publication can settle `cancelled`, holds behind a live note only the
# commands naming its node, and publishes an out-of-band landing under its
# owning node's title. 0.60.3 links onevcs 0.40 and onetaskgraph 0.2.58, and
# 0.60.4 names a died dispatch's landing rather than its retired branch when its
# work landed. This crate serves each as the engine renders or journals it, and
# maps none of their words. A browser-adopted run's driver is this line's copy
# of the engine, so it carries each of these once this moves; the dev-only
# `onevcs` and `onetaskgraph-*` requirements move with it.
# `a_quiet_run_a_live_driver_holds_is_served_parked_and_its_adoption_is_refused`
# holds 0.60.1's `PARKED` through the read and adopt routes over a driver alive
# on this host.
#
# 0.61.0 adds a lifecycle node's `publish: "preserve"`: at closeout its branch is
# put on its identity's origin and it settles `done` as `preserved`, carrying
# `branch`, `head` and `remote` and no `landing`. It also adds `telemetry RUN
# --changes`, which this crate does not serve. Nothing here enumerates an
# outcome, so the word is served as journalled, and a node's publication reads
# `merged` only off a merge record or the `merged` outcome, so a kept branch is
# never served as landed;
# `a_node_its_plan_kept_is_served_done_with_its_branch_and_head_and_never_landed`
# holds that through the run and results routes. It links onevcs 0.42, which the
# dev-only `onevcs` requirement moves with.
#
# 0.61.1 links an engine that accepts a `reparent` of a waiting, unattested
# `kind: human` approval and re-gates it behind its new prerequisites, clearing
# its recorded wait; every other recorded node, and an `attest` followed by a
# `reparent` of one approval in a single envelope, is still refused. A run
# adopted from the browser is driven, and the replies posted to it applied, by
# this copy of the engine, so this changes which edits such a run accepts and
# no route or response;
# `a_waiting_approval_reparented_onto_unfinished_work_is_no_longer_offered_for_attestation`
# holds it through the reply, status and attest routes.
#
# 0.62.0 registers project templates and checks a stored project's rendering,
# lets a preserved lifecycle node build on a preserved dependency, and links
# onetaskgraph 0.3.2, whose 0.3.0 scopes a source's `status_mapping` by item kind
# and refuses a status it does not map. Nothing here reads a `status_mapping` or
# a template: the plan stores this crate's journeys configure are `local-md`
# sources, which declare no `status_mapping`. A browser-adopted run's driver is
# this line's copy of the engine, so it carries each of these once this moves,
# and the dev-only `onetaskgraph-*` requirements move with it;
# `an_adoption_of_a_run_launched_with_a_template_root_and_require_rendered_dispatches_it`
# and `an_adopted_run_settles_a_plan_spanning_two_sources_where_each_task_lives`
# hold an adopted run's plan store through that engine.
#
# Since 0.56.0 its `unwatched` reads `ONEPIPELINE_WAKE_BUDGET`, so
# `GET /api/v2/unwatched` asks `verbs::Unwatched::within` under the budget
# `verbs::WakeBudget::from_environment` reads from the server's own environment
# rather than `verbs::unwatched`, which asks under none; the route and its
# shape are unchanged, and
# `unwatched_asks_under_the_wake_budget_the_servers_environment_sets` and
# `an_owed_run_that_converged_with_a_failure_is_unwatched_until_it_is_closed`
# hold it to the CLI.
onepipeline = "=0.62.0"
# llmlint: ignore-end[changed_behavior_has_e2e]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, which is what lets
# a served payload round-trip byte for byte against the checked-in fixtures the
# contract tests compare to `docs/contract.md`.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-stream = "0.1"

# The one system call this crate makes that `std` has no door onto: reaping a
# retained driver's exit status. `POST .../adopt` leaves a driver behind that is
# this process's child and nobody's to wait on — the SDK keeps no handle, by
# design — and a child nobody waits on stays a zombie, which answers every
# liveness probe as alive. `src/store.rs`'s reaper is the only caller and says
# what a platform with no zombies to reap does instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
# The drift gate on the sibling vocabulary `src/payload.rs` reads from `onevcs`.
# That library's `event` module is private, but it re-exports `EventKind` from
# its crate root, so its kinds are a declaration a consumer can reach and the
# copy is held to it rather than to a second reading of the wire. Held at the
# major `onepipeline` resolves, so the gate reads the same declaration the
# records reaching this crate were written by, and the tree carries one version
# of it rather than two. The same gate on `oneagentgraph`'s vocabulary reads the
# dependency above, which the crate now links in its own right.
onevcs = "0.42.0"
# The same library the crate links above, with the schema bundle it publishes
# for its SDK consumers: the history record's schema is where `oneharness`
# closes the two kinds an agent's own words are streamed under, so
# `tests/contract.rs` holds `payload::graph::MESSAGE` and `REASONING` to it.
# A test-only feature, so the shipped binary compiles none of it.
oneharness-core = { version = "0.24.0", features = ["sdk-schema"] }
predicates = "3"
# The drift gate on the browser's copy of the reply envelope's commands reads
# each op's fields off the engine's own `Command` through the schema that type
# derives, so the copy is held to the declaration rather than to a second
# reading of the engine's prose. Held at the major `onepipeline` resolves, so
# the tree links one version of it.
# The store a host renders its tasks into, linked for the journey that launches
# a run from a real rendering: `onetaskgraph task create --template-loader` is a
# call into `Engine::create_task`, so a journey makes that call rather than
# provisioning a second CLI. Unpinned for the reason `oneagentgraph` is: the
# engine pins this family exactly, and the lock resolves the one copy it links.
onetaskgraph-core = "0.3.2"
onetaskgraph-plugin-api = "0.3.2"
schemars = "1"
tempfile = "3"
# The parser `release-targets.toml` is read with, both by the schema check in
# `tests/packaging.rs` and by the journeys that drive the probe over every
# identifier that document declares. The declaration is TOML because the
# canonical schema says so, and reading it with a real parser rather than by
# pattern is what makes this repository's copy of the schema a check on the
# document rather than a second reading of its text.
toml = "1"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "build-cache"
path = "tests/build_cache.rs"
# Only dag-ui-build-cache:test runs the repeated real frontend builds, and
# dag-ui-build-cache:lint denies this target's diagnostics: `test = false` keeps
# it out of `clippy --all-targets`.
test = false

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
