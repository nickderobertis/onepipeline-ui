# Automated releases from conventional commits, driven by release-plz.
#
# Flow:
#   1. Commits land on `main` (pre-1.0: feat -> minor, fix/perf/refactor/build ->
#      patch, `!`/BREAKING -> minor; chore/docs/ci/test/style do not release).
#      release-plz only *sees* a commit that touched the crate's packaged files,
#      so what releases is governed by `[package] include` in Cargo.toml — which
#      is why that list reaches past the crate to the frontend and the wrappers,
#      everything one version stamps. See the comment on it.
#   2. The `release-pr` job opens/updates a PR that bumps the version in
#      Cargo.toml + Cargo.lock and writes the CHANGELOG section.
#   3. Merging that PR makes the `release` job tag `vX.Y.Z` and cut a GitHub
#      Release with the changelog notes. That Release (created with a PAT, not
#      the default GITHUB_TOKEN) triggers release.yml, which builds and publishes
#      the binaries, the wheels, and the npm packages.

[workspace]
# release-plz only versions, changelogs, tags, and cuts the GitHub Release — it
# never runs `cargo publish`. crates.io publishing is a separate step: the
# `publish-crate` job in release.yml, which self-activates when the
# CARGO_REGISTRY_TOKEN secret is set. Keeping it out of release-plz decouples
# versioning/tagging from the registry push.
publish = false

# The bump above is a reading of the commit *type*, which is a claim about the
# author's intent; this reads the public surface instead, so a breaking change no
# longer releases as a compatible one whenever nobody wrote the `!`. It is worth
# as much as a baseline that builds and no more — release-plz reports a check that
# could not run as "API compatible", never as a failure, so a baseline that stops
# compiling would quietly return the bump to the commit type. Making it build, and
# refusing a release when it does not, is .github/workflows/release-plz.yml's job.
#
# llmlint: ignore[changed_behavior_has_e2e] the journey needs a released tag, both dependency trees fetched, and two binaries the gate does not provision, so it runs in the release workflow — which fails the run when the check returns no verdict.
semver_check = true

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Keep-a-Changelog-style grouping. The version bump is computed from the
# conventional-commit *type*, independent of these display groups.
[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { body = ".*", group = "Other" },
]
