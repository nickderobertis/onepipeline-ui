<!doctype html>
<!-- `dark` is the class @oneharness/ui's stylesheet selects its dark tokens with. It
     is set on the document element, before the app mounts, so the package's
     components and this app's own surfaces paint one palette from the first frame. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111622" />
    <title>DAG Observatory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
