schema_version: 1
# Every figure here is read from telemetry/read-latency.json, which
# `dag-ui-read-latency:test` records over the workload each description states;
# the one runner reports the figure and its breakdown and compares nothing. No
# budget here carries a `host` label: each fails `test-linux`'s affected tier on
# a regression rather than waiting on an hour-long manual re-record.
budgets:
  - id: dag-ui-human-items-requests-per-minute
    description: >-
      Requests Action items sends while items change. HTTP requests the browser
      sends per minute with Action items open after its load, while items change,
      beside the tab's one open `GET /api/v2/events` connection; detail reports
      requests by route and connections opened. One browser tab on Action items
      with no run view, unfiltered and filtered, a server over 850 run
      directories, a human-item journal starting at 71 events and 112 KB, and 40
      raises, answers, completions and dismissals through the real `onepipeline
      human-items` CLI, spaced 3 s apart, none from this tab. Design requirement;
      telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency.json, --metric, human-items-requests]
    unit: requests/min
    direction: max
    threshold: 0
  - id: dag-ui-human-items-update-lag-seconds
    description: >-
      Time for an Action items change to reach every tab. Seconds a person waits
      for a change to show on the open Action items page: the slowest of (a) the
      95th-percentile seconds from a spaced write committing through the real CLI
      to the open page rendering it, over the unfiltered and the filtered page,
      and (b) for one 50-answer batch sent at once from the page, the seconds from
      the press of the send bar to the moment the last of its 50 questions has
      left the open list, taken in each of the two tabs open on the page, so the
      request, the journal commit and the update all count. Detail reports each
      page's spaced-write p50, p95 and maximum, the batch's lag in each tab, the
      batch request's own response time, and frame arrival. Spaced writes: one
      browser tab on Action items with no run view, unfiltered and then filtered,
      a server over 850 run directories, a human-item journal starting at 71
      events and 112 KB, and 40 raises, answers, completions and dismissals
      through the real `onepipeline human-items` CLI, spaced 3 s apart, none from
      this tab. Batch phase: one fresh server over the same corpus and grown
      journal, 50 open high-priority questions raised through the real CLI before
      the phase starts (25 offering 3 choices, 25 offering none), and two tabs
      open on Action items, one unfiltered and one filtered to high priority; the
      filtered tab drafts all 50 (25 by a choice press, 25 by typed text) and
      sends them with one press of its send bar, one `POST
      /api/human-items/answers` carrying 50 answers, and the unfiltered tab sends
      nothing. Design bound; telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency.json, --metric, human-items-lag]
    unit: seconds
    direction: max
    threshold: 3
  - id: dag-ui-run-first-view-seconds
    description: >-
      First useful screen of a large run, on any view. Seconds from navigation
      start to the first useful screen, a rendered DOM state, in a real browser
      with the bundle in the HTTP cache, on a fresh release server that has
      answered one sidebar read; the median of 3 readings per view, then the
      slowest of Graph, Overall and the busiest node's timeline. Detail per view:
      navigation to POST, the POST, answer to mark, first-answer bytes raw and
      gzipped, cold-cache and fresh-server readings, a small settled run, and the
      corpus's drivers. Phone network time is excluded. 850 warmed run
      directories, one tab on loopback, the opened run live at 116,000 records,
      100 MB, 2,000 streams, 9,900 spans, a 7 MB checkpoint and a 10,000-record
      node, and 11 other live runs at 50 records per minute. Basis design;
      telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --metric, first-view]
    unit: seconds
    direction: max
    threshold: 1
  - id: dag-ui-run-rest-arrived-seconds
    description: >-
      Time until a large run's loading values have all arrived. Seconds from the
      first useful screen until the rendered page holds every value it marked
      loading, progress.complete true, on Overall on the large run; detail
      reports Graph and a node, the patch frames' bytes and the server's peak
      memory. 850 warmed run directories, one tab on loopback, the opened run
      live at 116,000 records, 100 MB, 2,000 streams, 9,900 spans, a 7 MB
      checkpoint and a 10,000-record node, and 11 other live runs at 50 records
      per minute. Basis estimate; telemetry analysis only, approximately 2
      seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --metric, rest-arrived]
    unit: seconds
    direction: max
    threshold: 60
  - id: dag-ui-run-history-page-seconds
    description: >-
      Time to show the next page of a run's history. Seconds from asking for
      earlier rows on the busiest node's timeline, by the page's own control, to
      those rows rendered, the slowest of a page before the complete read ends
      and one after; detail reports each and Overall's span page. 850 warmed run
      directories, one tab on loopback, the opened run live at 116,000 records,
      100 MB, 2,000 streams, 9,900 spans, a 7 MB checkpoint and a 10,000-record
      node, and 11 other live runs at 50 records per minute. Basis estimate;
      telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --metric, history-page]
    unit: seconds
    direction: max
    threshold: 1
  - id: dag-ui-run-status-read-seconds
    description: >-
      Status read of one run through the API. Wall-clock seconds of GET
      /api/v2/runs/<run>/status as the browser's client takes it, on a release
      server, the slowest of the small and the large run; detail reports each
      run's figure, the checkpoint's bytes and the stand-in provider's starts.
      Inner measure: the control panel makes this request after the view has
      opened, so nothing on screen waits on it alone. One read of a settled
      1-node run and one of the live run at 116,000 records, 100 MB and a 7 MB
      checkpoint, over 850 run directories, with a claude stand-in on PATH that
      takes 20 s and records each start. Basis design; telemetry analysis only,
      approximately 2 seconds.
    measure: reported
    command: [node, read-latency-budget.mjs, --metric, status]
    unit: seconds
    direction: max
    threshold: 1
