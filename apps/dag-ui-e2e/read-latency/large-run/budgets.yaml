schema_version: 1
# Every figure here is read from telemetry/read-latency-large.json, which
# `dag-ui-read-latency:test-large` records over the workload each description
# states; the one runner reports the figure and its breakdown and compares
# nothing. No budget here carries a `host` label. They are recorded apart from
# `../budgets.yaml`'s, by a target of their own, and the `budgets` job runs that
# target and `budgets-large` on every pull request that reaches this project and on
# the release pull request's sweep, so a regression fails the change that made it.
budgets:
  - id: dag-ui-run-first-view-seconds
    description: >-
      First useful screen of a large run, on any view. Seconds from navigation
      start to the first useful screen, a rendered DOM state, in a real browser
      with the bundle in the HTTP cache, on a fresh release server that has
      answered one sidebar read; the median of 3 readings per view, then the
      slowest of Graph, Overall and the busiest node's timeline, and Overall on a
      settled 9-node run of 76,000 records and 57 MB whose drivers relayed 27,700
      of them at no node, most naming no session. Detail per view:
      navigation to POST, the POST and inside it the engine's heads read and
      fetch, the timeline, detail and serialization, answer to mark,
      first-answer bytes raw and gzipped, cold-cache and fresh-server readings,
      a small settled run, and the corpus's drivers. Phone network time is
      excluded. 850 warmed run directories, one tab on loopback, the opened run
      live at 116,000 records, 100 MB, 2,000 streams, 9,900 spans, a 7 MB
      checkpoint and a 10,000-record node, and 11 other live runs at 50 records
      per minute. Basis design; telemetry analysis only, approximately 2
      seconds.
    measure: reported
    command: [node, ../read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency-large.json, --metric, first-view]
    unit: seconds
    direction: max
    threshold: 1
  - id: dag-ui-run-rest-arrived-seconds
    description: >-
      Time until a large run's loading values have all arrived. Seconds from the
      first useful screen until the rendered page holds every value it marked
      loading, progress.complete true, on Overall on the large run; detail
      reports Graph and a node, the patch frames' bytes and the server's peak
      memory. 850 warmed run directories, one tab on loopback, the opened run
      live at 116,000 records, 100 MB, 2,000 streams, 9,900 spans, a 7 MB
      checkpoint and a 10,000-record node, and 11 other live runs at 50 records
      per minute. Basis estimate; telemetry analysis only, approximately 2
      seconds.
    measure: reported
    command: [node, ../read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency-large.json, --metric, rest-arrived]
    unit: seconds
    direction: max
    threshold: 60
  - id: dag-ui-run-history-page-seconds
    description: >-
      Time to read the next page of a run's history. Seconds from asking for a
      page of the busiest node's earlier rows on the paged route
      (timeline/events, limit 100), as the client requests it, to the page
      read, the slowest of a page before the complete read ends and one after;
      detail reports each and Overall's span page. Since manager ruling a11 this
      is the paged route's own page: the view reads a node whole through its
      stream (dag-ui-node-timeline-complete-seconds), so readings before it,
      which timed the view's Load earlier control to rows rendered, are not the
      same quantity. 850 warmed run
      directories, one tab on loopback, the opened run live at 116,000 records,
      100 MB, 2,000 streams, 9,900 spans, a 7 MB checkpoint and a 10,000-record
      node, and 11 other live runs at 50 records per minute. Basis estimate;
      telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, ../read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency-large.json, --metric, history-page]
    unit: seconds
    direction: max
    threshold: 1
  - id: dag-ui-node-timeline-complete-seconds
    description: >-
      Busiest node's timeline fully loaded. Seconds from navigation start on the
      busiest node's Timeline tab, with the bundle in the HTTP cache, on a fresh
      release server, until the node panel's chart and event list each hold
      every record of that node's complete timeline document and the node panel
      shows no loading, partial or Load earlier mark; the median of 3 readings.
      The run-level "rest of this run's history is still loading" banner is not
      part of it: that is the run's own read, held by
      dag-ui-run-rest-arrived-seconds. Detail reports each reading, time to
      first render, time to the partial mark if shown, the node read's requests
      and bytes decoded and on the wire, the server's time to first byte with
      its heads, fetch and build split, and the records the chart and the list
      held. The large-run fixture's busiest node at 10,000 records in the opened
      live run of 116,000 records and 100 MB, over 850 run directories with 11
      other live runs at 50 records per minute, one tab on loopback; sized
      against this host's largest real nodes of 14,219, 10,639 and 9,882
      records. Basis measured (spike-node-timeline-load: worst of 76 readings
      6.16 s; 7 s the lowest whole second that held on every reading);
      telemetry analysis only, approximately 2 seconds.
    measure: reported
    command: [node, ../read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency-large.json, --metric, node-timeline-complete]
    unit: seconds
    direction: max
    threshold: 7
  - id: dag-ui-run-status-read-seconds
    description: >-
      Status read of one run through the API. Wall-clock seconds of GET
      /api/v2/runs/<run>/status as the browser's client takes it, on a release
      server, the slowest of the small and the large run; detail reports each
      run's figure, the checkpoint's bytes and the stand-in provider's starts.
      Inner measure: the control panel makes this request after the view has
      opened, so nothing on screen waits on it alone. One read of a settled
      1-node run and one of the live run at 116,000 records, 100 MB and a 7 MB
      checkpoint, over 850 run directories, with a claude stand-in on PATH that
      takes 20 s and records each start. Basis design; telemetry analysis only,
      approximately 2 seconds.
    measure: reported
    command: [node, ../read-latency-budget.mjs, --telemetry, apps/dag-ui-e2e/read-latency/telemetry/read-latency-large.json, --metric, status]
    unit: seconds
    direction: max
    threshold: 1
