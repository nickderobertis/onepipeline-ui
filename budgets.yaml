# The repository's CI, CD and local-gate budgets. Every figure is read from
# telemetry rather than measured fresh, so none carries a `host` label; each
# carries the label of the one place it is checked:
#
#   release-tail   the last step of release.yml's `publish`, reporting only:
#                  `onebudgetspec check budgets.yaml --label release-tail`, after
#                  the Release is settled. The GitHub figures, taken by
#                  scripts/actions-budget-figures.sh (copied byte for byte
#                  from dero-skills' create-repo at 270bea5, version 12, so its
#                  header is the source's own). The seven host figures use
#                  onevcs's read-only queries; cache-use and cache-headroom read
#                  GitHub's API directly. The CD figures leave out `CI cache`, the main-push
#                  cache warmer, and `CI`, whose push run at the release commit is only the
#                  `budgets` report job: neither delivers anything to a release.
#   host-variable  `just gate` on a development machine, as a warning: the
#                  recipe records its own start and end, then checks this label.
#
# Any other check of this file excludes both labels; at pull-request time each
# CI job's `timeout-minutes: 30` is what fails a check that runs over. ci.yml's
# `budgets` job reports both labels' budgets without enforcing them.
schema_version: 1
budgets:
  # Workload: one release carrying 1 to 3 merged PRs, each PR's last commit running
  # the 4 CI jobs; 54 releases and 140 merged PRs, 85 of them not release PRs, in
  # 31 days (2026-09-15 to 10-16). Basis: design; the 30-minute line is the
  # user's requirement. Today: 1,294 s median, 1,800 s p90 (window).
  - id: onepipeline-ui-ci-check-time
    description: >-
      The longest counted job of each pull request's last-commit CI runs, over
      the pull requests one release carries, in seconds from GitHub's job
      timestamps. Holds each check to 30 minutes, because one slow check holds
      every change behind it; `timeout-minutes: 30` enforces it at PR time.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, longest-job, --stage, pr]
    unit: seconds
    direction: max
    threshold: 1800
    labels: [release-tail]
  # Workload: one release's 6 CD jobs: release-plz, build-linux,
  # build-linux-arm64, build-macos, build-windows and publish (build-linux-arm64
  # restored as a sixth by the user on 2026-10-20); 54 releases and 140 merged
  # PRs, 85 of them not release PRs, in 31 days (2026-09-15 to 10-16). Basis:
  # design; the 30-minute line is the user's requirement. Today: 2,374 s median
  # (current shape). The main-push cache warmer (`CI cache`) delivers nothing to
  # a release, so the figure leaves its run at the release commit out.
  - id: onepipeline-ui-cd-job-time
    description: >-
      The longest counted job of one release's CD runs (release-plz's run at
      the release commit and the Release run's six jobs, `publish` up to this
      check), in seconds. Holds each CD job to 30 minutes, the actionable unit
      inside the release cycle.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, longest-job, --stage, cd, --exclude-workflow, CI cache, --exclude-workflow, CI]
    unit: seconds
    direction: max
    threshold: 1800
    labels: [release-tail]
  # Workload: one release carrying 1 to 3 merged PRs, each PR's last commit running
  # the 4 CI jobs; 54 releases and 140 merged PRs, 85 of them not release PRs, in
  # 31 days (2026-09-15 to 10-16). Basis: design; the 90-minute line is the
  # user's requirement. Today: 13,549 s median per release (current shape).
  - id: onepipeline-ui-release-cycle-time
    description: >-
      Per pull request one release carries whose merge changes a published path,
      its last commit's checks (first run
      created to last job completed) plus its merge to the end of `publish`; the
      maximum over the release's pull requests, in seconds. Holds a change to 90
      minutes from its final checks to its release.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, release-cycle-time, --published-paths, .github/release-published-paths]
    unit: seconds
    direction: max
    threshold: 5400
    labels: [release-tail]
  # Workload: one release carrying 1 to 3 merged PRs, each PR's last commit running
  # the 4 CI jobs; 54 releases and 140 merged PRs, 85 of them not release PRs, in
  # 31 days (2026-09-15 to 10-16). Basis: arithmetic; 4 is the user's ruling for a
  # cross-platform repository, `lint` plus one test job per platform, and the one
  # `budgets` report job makes 4 + 1 = 5. Today: 19 jobs median at a current-shape
  # PR head.
  - id: onepipeline-ui-ci-job-count
    description: >-
      The most counted jobs any one pull request's last-commit `pull_request`
      runs started, every workflow, over the pull requests one release carries.
      Holds this repository's share of the account-wide 20-job concurrency limit
      that every repository shares.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, job-count, --stage, pr]
    unit: jobs
    direction: max
    threshold: 5
    labels: [release-tail]
  # Workload: one release's CD runs, 6 jobs: release-plz, build-linux,
  # build-linux-arm64, build-macos, build-windows and publish; 54 releases and
  # 140 merged PRs, 85 of them not release PRs, in 31 days (2026-09-15 to
  # 10-16). Basis: design; 6 is the user's ruling: the task's 5 (release-plz,
  # three build jobs and publish) plus build-linux-arm64, restored on
  # 2026-10-20. Today: 42.5 jobs median per release's CD (current shape). The
  # main-push cache warmer (`CI cache`) is left out, as delivering nothing.
  - id: onepipeline-ui-cd-job-count
    description: >-
      The counted jobs of one release's CD runs, `publish` itself included as
      the job running this check. Holds the share of the account-wide 20-job
      concurrency limit this repository's CD takes.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, job-count, --stage, cd, --exclude-workflow, CI cache, --exclude-workflow, CI]
    unit: jobs
    direction: max
    threshold: 6
    labels: [release-tail]
  # Workload: one release of the CD shape (the task's five jobs, six with
  # build-linux-arm64 since 2026-10-20) whose pull request heads each run the one
  # CI workflow, its release commit carrying release-plz's push run and the
  # Release run, the cache warmer's run left out; one release carrying 1 to 3 merged PRs, each PR's last
  # commit running the 4 CI jobs; 54 releases and 140 merged PRs, 85 of them not
  # release PRs, in 31 days (2026-09-15 to 10-16). Basis: design: releases 1,
  # comparison 1, closed pull requests 1, runs at the release commit 1, jobs of
  # release-plz's run and the Release run 2.
  - id: onepipeline-ui-release-read-requests
    description: >-
      The REST requests the release's own reads cost — the releases listing, the
      comparison, the closed-pull-request page, the runs at the release commit
      and the jobs of its CD runs — summed from the onevcs answers' `cost`.
      Holds the tail's GitHub reads for the release itself, apart from the reads
      each pull request adds.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, release-read-requests, --exclude-workflow, CI cache, --exclude-workflow, CI]
    unit: requests
    direction: max
    threshold: 6
    labels: [release-tail]
  # Workload: one release of the CD shape (the task's five jobs, six with
  # build-linux-arm64 since 2026-10-20) whose pull request heads each run the one
  # CI workflow; one release carrying 1 to 3 merged PRs, each PR's
  # last commit running the 4 CI jobs; 54 releases and 140 merged PRs, 85 of them
  # not release PRs, in 31 days (2026-09-15 to 10-16). Basis: design: runs at the
  # head 1, jobs of the one CI run 1.
  - id: onepipeline-ui-pr-read-requests
    description: >-
      The most REST requests any one pull request of the release needed — its
      runs at head and the jobs of its CI runs — from its `change-checks`
      answer's `cost`. Holds the reads each pull request adds to the tail,
      whatever number of pull requests a release carries.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, pr-read-requests]
    unit: requests
    direction: max
    threshold: 2
    labels: [release-tail]
  # Workload: one run of `just gate`, the repository's gate recipe, on a
  # development host such as a 14-core aarch64 machine, with the Nx cache as that
  # run finds it. Basis: design; the 30-minute line applies to development
  # machines as a warning. On that host `just gate 5a2daca` measured 1,014.5 s
  # cold and 33.7 s warm.
  - id: onepipeline-ui-gate-time
    description: >-
      The wall clock of one `just gate` run on a development machine, from the
      start and end the recipe records on that run. Holds the local gate to the
      same 30-minute line as each CI check, as a warning, since a machine's
      timing varies too much to refuse on.
    measure: reported
    command: [node, scripts/gate-time-budget.mjs]
    unit: seconds
    direction: max
    threshold: 1800
    labels: [host-variable]

  # Workload: the newest release of this repository with evidence when the command
  # runs, carrying 1 to 9 merged pull requests at 3 pushes each and 4 CI jobs per
  # push, with 461 minutes at p90 from promotion to the release pull request.
  # Basis: design, threshold unchanged by manager ruling
  # c-3139a3760ceeae629b02b38b72219f14: 100 remains a design target revisited after
  # release-tail observations. Over 30 days to 2026-11-06 a non-release merge moved
  # the base under 9 of 128 pull requests, so a reading under 100 is expected and not
  # alarming. Measurement source: telemetry, the executions.json and promotion receipts
  # lint, test-linux, test-windows, test-macos and release-plz record through
  # nx-remote-cache.mjs. About 60 seconds, carried from the ci-release-test-cache plan's
  # estimate for reading metadata and artifacts for one release.
  - id: onepipeline-ui-nx-cache-use
    description: >-
      Remote hits as a percentage of attempt-qualified cacheable task/OS/hash
      executions, excluding local hits, with base_moved tasks counted as misses.
      Detail: misses by class (throttled, failed, evicted, never_promoted,
      base_moved), attempts whose evidence is unavailable, receipt ages and
      requests.
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, cache-use]
    unit: percent
    direction: min
    threshold: 100
    labels: [release-tail]

  # Workload: one reading of this repository's real listing as it stands when the
  # command runs, about 150 entries. The target is sized for one warm run saving three
  # families beside the previous copy of each, 461 minutes at p90 and 1,775 at most from
  # promotion to release pull request, and about 6 pushes a day at about 1 MB of results
  # each. Basis: arithmetic over spike-cache-eviction's 8-hour watch to 2026-11-07 (229
  # readings here) and warm logs since 2026-11-02. A run must save beside the old copies
  # under 10 GiB: 2C + g + O + R <= L, with L 10.737, O 0.436, R 0.05 and g/C 1.176/8.792.
  # So C <= 4.80 GB and the target is 10.737 - 0.436 - 4.80 = 5.50 GB. Eviction was
  # observed only in onetaskgraph and is carried over by ruling.
  # spike-onepipeline-ui-contents projects 6.72 GB (9.261 GB less 3.442 and 1.797). Ticket
  # ai-orchestrator#2339's 0.5 GB is under a median saving run's 5.78 GB. Each warm
  # workflow's concurrency group holds it to one run at a time, and each leg's cleanup
  # runs before its save and keeps the newest copy, so a family holds at most two copies
  # at any moment; that bound is 2C + g. Results now count in the figure, at most about
  # 0.042 GB at 6 MB a day over GitHub's 7-day idle limit, within the 0.05 reserved. About
  # 10 seconds: one request per 100 entries over every page, 5 to 8 requests measured at
  # 588 entries and 12 to 24 at about 1,900. The outer figures, nx-cache-use and
  # release-cycle-time, fall only after results are lost; this shows the cause before
  # that, and names the family responsible.
  - id: onepipeline-ui-cache-headroom
    description: >-
      Room left for one warm run's saves and test results: GitHub's stated
      Actions-cache allowance, 10 GiB, minus the bytes of every entry, test results
      (nx-cache-*) included, read over every page of the listing when the command
      runs, in gigabytes of 10^9 bytes and negative when those bytes are over the
      line. A family the command names counts only its newest entry, because a working
      cleanup leaves the previous copy until the next push to main; when a named
      family holds more than two entries the figure is 0, which reads over, because
      two is the most a working cleanup leaves. Detail: the allowance, non-result
      bytes per key family, older copies' bytes, any family over two entries, result
      entries and bytes, the oldest result's age, the requests the read made and the
      lowest rate-limit remaining.
    measure: reported
    command:
      - bash
      - scripts/actions-budget-figures.sh
      - cache-headroom
      - --family
      - v0-rust-test-linux-Linux-x64-
      - --family
      - v0-rust-test-windows-Windows_NT-x64-
      - --family
      - v0-rust-test-macos-Darwin-arm64-
      - --family
      - onepipeline-cli-Linux-X64-
      - --family
      - onepipeline-cli-Windows-X64-
      - --family
      - onepipeline-cli-macOS-ARM64-
      - --family
      - onepipeline-api-baseline-Linux-X64-
      - --family
      - v0-rust-release-plz-Linux-x64-
    unit: gigabytes
    direction: min
    threshold: 5.5
    labels: [release-tail]
