# cargo-deny policy. Strict by default: advisories, licenses, bans, and sources
# all fail the check rather than warn. Any exception below is explicit and
# carries a reason so the policy never silently accumulates debt. Run via
# `just deps-check` and a dedicated CI job (it needs a network advisory DB), not
# the core `just check` gate.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this MIT-licensed binary. Adding a
# dependency with a new license fails the check until it is reviewed and added.
# Kept to exactly what the current graph uses, so the list stays a reviewed
# record rather than a wish list — cargo-deny warns about allowances it never
# encounters, and that noise is how an unreviewed license slips in unnoticed.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # Public-domain dedication used by the BurntSushi crates the e2e assertion
    # helpers pull in (bstr, memchr, regex-automata). Each is dual-licensed
    # Unlicense OR MIT; both are permissive and compatible.
    "Unlicense",
    # The TLS stack the onepipeline SDK reaches the network through
    # (ureq -> rustls -> ring): `untrusted` and `rustls-webpki` are ISC,
    # `subtle` is BSD-3-Clause. `matchit`, axum's router, is MIT AND
    # BSD-3-Clause. All four are OSI-approved, FSF-free, and impose only
    # attribution — the same bar as the MIT this binary ships under.
    "ISC",
    "BSD-3-Clause",
    # Mozilla's CA root bundle, as `webpki-roots` and `webpki-root-certs`. It
    # arrives with the onepipeline SDK (onepipeline -> oneagentgraph -> ureq),
    # and it licenses *data* — the certificate list — not code: CDLA-Permissive
    # 2.0 places no condition at all on what a recipient does with it, and none
    # on this binary. Reviewed when `onepipeline` was first depended on.
    "CDLA-Permissive-2.0",
    # MIT with the attribution clause struck out, on `borrow-or-share`. It comes
    # in under the onepipeline SDK's schema validation (onepipeline ->
    # oneharness-core -> jsonschema -> referencing -> fluent-uri). OSI-approved
    # and FSF-free, and strictly weaker than the MIT this binary ships under:
    # having dropped the notice requirement it imposes no condition to carry.
    "MIT-0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
